# gitleaks configuration: the default rules plus the allowlists below. Without [extend] useDefault this file
# would replace the default rules and detect nothing.
#
# The test fixtures in the tree hold no secret-shaped literal: they are joined from split strings, so stock
# gitleaks finds nothing in them and they need no allowlist. The history still holds the earlier literals, so
# each entry below allows one exact value (anchored at both ends), in one file, and only in the commits that
# hold it (condition = "AND"). The same value in any other commit, and any other secret in the same commits or
# files, is reported. The one entry without commits is for a file this change does not edit; it allows one exact
# token there and nothing else. secret-scan.yml also scans the changes that only a merge commit introduces.
# Tests: hack/test/gitleaks_test.sh.
[extend]
useDefault = true

# Upstream response redaction with a fake GitHub token. The file is not changed here, so the value is still in
# the tree; split it like the others, then scope this entry by commit.
[[allowlists]]
condition = "AND"
paths = ['''^internal/gate/mcp/upstream_test\.go$''']
regexes = ['''^ghp_1234567890abcdefghijklmnop1234567890$''']

# History only: A council title redaction test: a bare PEM header followed by test code, no key body.
[[allowlists]]
condition = "AND"
commits = ["930a41ba565e9d432e9a304bb5e8a8f47c596cd4", "bfaf52594cec602b594ad7b1b6e2e7c903d42d13"]
paths = ['''^cmd/sablecourtd/councils_test\.go$''']
regexes = ['''^-----BEGIN PRIVATE KEY----- concealed"`, rounds: 2, starts: 6, duration: 15 \* time\.Minute, roles: "claude,codex,agy", wantRef: "HEAD", wantCommit: head\},\n\t\t\{name: "embedded credential", bodyExtra: fmt\.Sprintf\(`,"title":%q`, "prefix"\+token\+"suffix"\), rounds: 2, starts: 6, duration: 15 \* time\.Minute, roles: "claude,codex,agy", wantRef: "HEAD", wantCommit: head\},\n\t\} \{\n\t\tt\.Run\(tc\.name, func\(t \*testing\.T\) \{\n\t\t\tst := daemonTestStore\(t\)\n\t\t\th := councilTestHandler\(st, nil, councilTestOptions\(token\)\)\n\t\t\tquestion := "Review this"\n\t\t\tif tc\.name == "redaction" \{\n\t\t\t\tquestion \+= " -----BEGIN PRIVATE KEY-----$''']

