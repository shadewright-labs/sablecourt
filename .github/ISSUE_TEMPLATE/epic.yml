name: Epic
description: Propose a multi-package or multi-stage outcome
title: ""
labels: []
body:
  - type: markdown
    attributes:
      value: Describe the outcome and the work packages it needs.
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should be true when this epic is complete?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Background, evidence, and relevant decisions.
    validations:
      required: true
  - type: textarea
    id: adrs
    attributes:
      label: ADRs
      description: Link accepted or proposed architecture decisions.
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: In-scope work and explicit exclusions.
    validations:
      required: true
  - type: textarea
    id: decisions
    attributes:
      label: Decisions
      description: Decisions made and any still open.
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Observable completion checks, one per checkbox.
      placeholder: "- [ ] ..."
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: How to verify
      description: Commands, manual checks, or evidence needed.
  - type: textarea
    id: invariants
    attributes:
      label: Invariants touched
      description: List the hard invariants affected, or write None.
  - type: textarea
    id: dependencies
    attributes:
      label: Depends on
      description: Link issues that block this epic.
  - type: textarea
    id: slices
    attributes:
      label: Work packages
      description: Link each task issue. Each task should name the repository and files it changes.
    validations:
      required: true
  - type: input
    id: labels
    attributes:
      label: Labels
      description: Add the relevant area/ label.
      placeholder: area/docs
    validations:
      required: true
