name: CI

# One graph per pull request and push to main. The `changes` job decides once, from the files the pull request
# changes (hack/ci-changed.sh), which groups of checks have to run; the jobs below call the workflows that hold
# the checks and pass that decision as `run`. A called job that is not needed is skipped, which counts as
# passing only when the decision (or the event) deselected it. `ci-ok` is the single required check of this graph;
# its predicate is hack/ci-ok.sh (tests in hack/test/ci-ok_test.sh): the `changes` job must succeed with four
# boolean outputs, every job the decision selects and every job that always runs must succeed, and a job missing
# from the results fails it, so a broken `changes` job can never let a pull request merge unchecked.
#
# Never add trigger-level `paths` here: a workflow that never starts leaves its required check pending forever.
# A new job goes into the `needs` of `ci-ok` and into the table in hack/ci-ok.sh.
#
# Images are published from images.yml on main and v* tags; release.yml builds the binaries on v* tags;
# vulncheck.yml also has its weekly schedule. Cancelling superseded runs is safe only here, so the concurrency
# group is only in this file (in a called workflow github.workflow is the caller's name, and a second group
# there could deadlock the run).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Changed files
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      go: ${{ steps.changed.outputs.go }}
      images: ${{ steps.changed.outputs.images }}
      docs: ${{ steps.changed.outputs.docs }}
      codeql: ${{ steps.changed.outputs.codeql }}
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Decide from the changed files
        id: changed
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: hack/ci-changed.sh >> "$GITHUB_OUTPUT"

  lint:
    needs: changes
    permissions:
      contents: read
    uses: ./.github/workflows/lint.yml # zizmor: ignore[self-repository] actionlint 1.7.12 rejects the $/ form
    with:
      run: ${{ needs.changes.outputs.go == 'true' }}

  test:
    needs: changes
    permissions:
      contents: read
    uses: ./.github/workflows/test.yml # zizmor: ignore[self-repository] actionlint 1.7.12 rejects the $/ form
    with:
      run: ${{ needs.changes.outputs.go == 'true' }}

  govulncheck:
    needs: changes
    permissions:
      contents: read
    uses: ./.github/workflows/vulncheck.yml # zizmor: ignore[self-repository] actionlint 1.7.12 rejects the $/ form
    with:
      run: ${{ needs.changes.outputs.go == 'true' }}

  gosec:
    needs: changes
    permissions:
      contents: read
    uses: ./.github/workflows/gosec.yml # zizmor: ignore[self-repository] actionlint 1.7.12 rejects the $/ form
    with:
      run: ${{ needs.changes.outputs.go == 'true' }}

  # Pull request build only (amd64, no push); main and tags publish from images.yml.
  images:
    needs: changes
    if: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
    uses: ./.github/workflows/images-build.yml # zizmor: ignore[self-repository] actionlint 1.7.12 rejects the $/ form
    with:
      run: ${{ needs.changes.outputs.images == 'true' }}

  docs-check:
    needs: changes
    permissions:
      contents: read
    uses: ./.github/workflows/docs-check.yml # zizmor: ignore[self-repository] actionlint 1.7.12 rejects the $/ form
    with:
      run: ${{ needs.changes.outputs.docs == 'true' }}

  # Pull requests only, and only when Go code or workflows changed; main and the weekly run use codeql.yml's own
  # triggers. The caller grants what the called job asks for: security-events: write only here.
  codeql:
    needs: changes
    if: ${{ github.event_name == 'pull_request' && needs.changes.outputs.codeql == 'true' }}
    permissions:
      security-events: write
      contents: read
      actions: read
    uses: ./.github/workflows/codeql.yml # zizmor: ignore[self-repository] actionlint 1.7.12 rejects the $/ form

  # Always runs: the internal docs link check, the image reference check and the offline tests of the scripts
  # under hack/ (detector, ci-ok predicate, release helpers, fuzz enumerator, link checker).
  repo-checks:
    permissions:
      contents: read
    uses: ./.github/workflows/repo-checks.yml # zizmor: ignore[self-repository] actionlint 1.7.12 rejects the $/ form

  workflow-lint:
    permissions:
      contents: read
    uses: ./.github/workflows/workflow-lint.yml # zizmor: ignore[self-repository] actionlint 1.7.12 rejects the $/ form

  secret-scan:
    permissions:
      contents: read
    uses: ./.github/workflows/secret-scan.yml # zizmor: ignore[self-repository] actionlint 1.7.12 rejects the $/ form

  ci-ok:
    name: ci-ok
    if: ${{ always() }}
    needs: [changes, lint, test, govulncheck, gosec, images, docs-check, codeql, repo-checks, workflow-lint, secret-scan]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the results
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
        run: hack/ci-ok.sh
