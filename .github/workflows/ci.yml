name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test with race detector
        run: go test -race -count=1 ./...

      - name: Build binaries
        run: |
          go build ./cmd/sablecourtd
          go build ./cmd/sablectl
          go build ./cmd/sablecourt-agent
          go build ./examples/demo-agent

      - name: Validate example manifests
        run: go run ./cmd/sablectl validate ./examples/local-demo.yaml
