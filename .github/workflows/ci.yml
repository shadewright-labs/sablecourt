name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test with race detector
        run: go test -race -count=1 ./...

      - name: Fuzz Model Gate SSRF guard (SC-05)
        run: go test -fuzz=FuzzSC05_JoinUpstreamURLPreservesHostAndScheme -fuzztime=10s ./internal/gate/model

      - name: Build binaries
        run: |
          go build ./cmd/sablecourtd
          go build ./cmd/sablectl
          go build ./cmd/sablecourt-agent
          go build ./examples/demo-agent

      - name: Validate example manifests
        run: go run ./cmd/sablectl validate ./examples/local-demo.yaml

  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vulnerability scan (govulncheck)
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Static security analysis (gosec)
        uses: securego/gosec@master
        env:
          # The action's image can lag the Go version in go.mod; let it fetch the right toolchain.
          GOTOOLCHAIN: auto
        with:
          args: -exclude=G104,G304,G204 ./...

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
