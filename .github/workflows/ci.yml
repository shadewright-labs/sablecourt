name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test with race detector
        run: go test -race -count=1 ./...

      - name: Fuzz Model Gate SSRF guard (SC-05)
        run: go test -fuzz=FuzzSC05_JoinUpstreamURLPreservesHostAndScheme -fuzztime=10s ./internal/gate/model

      - name: Build binaries
        run: |
          go build ./cmd/sablecourtd
          go build ./cmd/sablectl
          go build ./cmd/sablecourt-agent
          go build ./examples/demo-agent

      - name: Validate example manifests
        run: go run ./cmd/sablectl validate ./examples/local-demo.yaml

  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vulnerability scan (govulncheck)
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Static security analysis (gosec)
        uses: securego/gosec@v2.30.0
        env:
          # The action's image can lag the Go version in go.mod; let it fetch the right toolchain.
          GOTOOLCHAIN: auto
        with:
          args: -exclude=G104,G304,G204 ./...

      - name: Secret scan (gitleaks)
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="/tmp/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$archive"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check -
          tar -xzf "$archive" -C /tmp gitleaks
          /tmp/gitleaks git --redact --exit-code 1
