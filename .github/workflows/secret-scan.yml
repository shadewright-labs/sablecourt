name: Secret scan

# Scans the full Git history with gitleaks (default rules plus the allowlist in .gitleaks.toml) and fails on any
# finding. Findings are printed redacted, so the log never holds a secret value. The scan always runs, whatever
# files changed: a secret can sit in any file.
# The scan command is hack/secret-scan.sh: every ref and the full history, including the changes that only a
# merge commit introduces (--diff-merges=first-parent). Run the same check locally with:
#   hack/secret-scan.sh gitleaks
# gitleaks is installed from the official release with a pinned sha256 (hack/install-gitleaks.sh), not through
# gitleaks/gitleaks-action, which asks organisations for a licence key.
# Called by ci.yml (the only trigger); always runs.
on:
  workflow_call:

permissions: {}

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: hack/install-gitleaks.sh "${RUNNER_TEMP}/gitleaks-bin"

      - name: Test the rules and allowlists
        run: hack/test/gitleaks_test.sh "${RUNNER_TEMP}/gitleaks-bin/gitleaks"

      - name: Scan the history
        run: hack/secret-scan.sh "${RUNNER_TEMP}/gitleaks-bin/gitleaks"
