name: Secret scan

# Scans Git history with gitleaks (default rules plus the allowlist in .gitleaks.toml) and fails on any
# finding. A pull request run scans only the commits the pull request brings (base..head from the event payload);
# a push to main or a manual run scans the full history of the checked-out ref, never other branches. Findings are printed redacted, so the log never holds a secret value. The scan always runs, whatever
# files changed: a secret can sit in any file.
# The scan command is hack/secret-scan.sh, including the changes that only a
# merge commit introduces (--diff-merges=separate). Run the same check locally with:
#   hack/secret-scan.sh gitleaks
# gitleaks is installed from the official release with a pinned sha256 (hack/install-gitleaks.sh), not through
# gitleaks/gitleaks-action, which asks organisations for a licence key.
# Called by ci.yml (the only trigger); always runs.
on:
  workflow_call:

permissions: {}

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: hack/install-gitleaks.sh "${RUNNER_TEMP}/gitleaks-bin"

      - name: Test the rules and allowlists
        run: hack/test/gitleaks_test.sh "${RUNNER_TEMP}/gitleaks-bin/gitleaks"

      - name: Scan the history
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            if [ -z "${PR_BASE_SHA}" ] || [ -z "${PR_HEAD_SHA}" ]; then
              echo "secret scan: the pull request event has no base or head commit id" >&2
              exit 1
            fi
            export SECRET_SCAN_BASE="${PR_BASE_SHA}" SECRET_SCAN_HEAD="${PR_HEAD_SHA}"
          fi
          hack/secret-scan.sh "${RUNNER_TEMP}/gitleaks-bin/gitleaks"
