name: Docs links

# Weekly report of external links in the tracked Markdown files that no longer answer. Never runs on pull
# requests, so a pull request does not depend on third-party sites, and never fails on a dead link: read the
# warnings in the run log. Internal links are checked on pull requests by docs-check.yml.
on:
  schedule:
    - cron: "17 5 * * 3" # Wednesdays 05:17 UTC
  workflow_dispatch:

permissions: {}

jobs:
  external:
    permissions:
      contents: read
    name: external links
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Report external links that do not answer
        run: python3 -I hack/docs-links.py external
