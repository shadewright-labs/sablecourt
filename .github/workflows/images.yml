name: Images

# Builds the daemon and agent targets of the Dockerfile for linux/amd64 and linux/arm64 and pushes them to
# ghcr.io/<owner>/sablecourt (daemon) and ghcr.io/<owner>/sablecourt-agent from main and v* tags; only the
# publish job has packages: write. The pull request build (amd64 only, no push, no write permission) is
# images-build.yml, called by ci.yml; it is a separate file because a called workflow may not contain a job that
# asks for more permissions than its caller grants, and this file's identity is what the signature is verified
# against. After the push, the same job signs each image index by digest with cosign keyless (GitHub OIDC, no
# key to store), attaches an SPDX SBOM per platform image (the child digests of the index) as a signed
# attestation, records a GitHub build provenance attestation on the index, and verifies all of them against the
# identity of this workflow, so a mismatch fails the run. The id-token and attestations permissions exist only on
# the publish job, which never runs for a pull request (forks included). Tags are cut by release-please or, for a
# pre-release, by hand (see docs/ci-and-releases.md). The gate job runs before anything is pushed: a tag must
# point at a commit on main (hack/require-on-main.sh) and be one the release process makes
# (hack/check-release-tag.sh: a stable tag equals the version in .release-please-manifest.json, a candidate is
# vX.Y.Z-rc.N for a newer version); a tag whose release is already published pushes nothing, so a rerun cannot
# replace published images (hack/release-state.sh). On a tag docker/metadata-action adds no sha tag; a release
# gets X.Y.Z, plus X.Y and latest only when no newer stable tag exists in that line or at all
# (hack/floating-tags.sh), so a floating tag never moves to an older version; a pre-release gets only the full
# version (0.2.0-rc.1).
on:
  push:
    branches: [main]
    tags: ["v*"]

permissions: {}

jobs:
  gate:
    name: Check the ref
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      published: ${{ steps.state.outputs.published || 'false' }}
      latest: ${{ steps.floating.outputs.latest }}
      minor: ${{ steps.floating.outputs.minor }}
    steps:
      # The history of main and all tags are fetched for the checks below.
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Require the tag to be on main
        if: github.ref_type == 'tag'
        run: hack/require-on-main.sh HEAD origin/main

      - name: Require a release tag
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: hack/check-release-tag.sh "${TAG}"

      - name: Check whether the release is already published
        id: state
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: hack/release-state.sh "${REPOSITORY}" "${TAG}" >> "$GITHUB_OUTPUT"

      - name: Decide the floating tags
        id: floating
        env:
          REF_NAME: ${{ github.ref_name }}
        run: hack/floating-tags.sh "${REF_NAME}" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish ${{ matrix.image }}
    needs: gate
    if: github.event_name == 'push' && needs.gate.outputs.published == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: sablecourt
            target: daemon
          - image: sablecourt-agent
            target: agent
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Compute tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=sha,enable=${{ github.ref_type != 'tag' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ needs.gate.outputs.minor == 'true' }}
            type=raw,value=latest,enable=${{ needs.gate.outputs.latest == 'true' }}

      # The builder stage runs on the build host and cross-compiles (CGO is off), and the final stages only copy
      # the binary, so the arm64 image needs no emulation.
      - name: Build and push both architectures
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      # Always by digest: a tag can move, the digest names the pushed index (both architectures).
      - name: Sign the image (keyless)
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      # The index has one image per platform; the SBOM is made and attested per platform image, because the
      # packages can differ. The children come from the index manifest, by digest.
      - name: Resolve the platform images
        id: platforms
        env:
          REF: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}
        run: hack/image-platform-digests.sh "${REF}" >> "$GITHUB_OUTPUT"

      # Syft scans the image it is given by its own digest, so each SBOM describes exactly that platform.
      - name: Generate the SPDX SBOM (linux/amd64)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}@${{ steps.platforms.outputs.amd64 }}
          format: spdx-json
          output-file: ${{ runner.temp }}/sbom-amd64.spdx.json
          upload-artifact: false
          upload-release-assets: false
          syft-version: v1.54.0

      - name: Generate the SPDX SBOM (linux/arm64)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}@${{ steps.platforms.outputs.arm64 }}
          format: spdx-json
          output-file: ${{ runner.temp }}/sbom-arm64.spdx.json
          upload-artifact: false
          upload-release-assets: false
          syft-version: v1.54.0

      - name: Attest the SBOMs
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          AMD64: ${{ steps.platforms.outputs.amd64 }}
          ARM64: ${{ steps.platforms.outputs.arm64 }}
          SBOM_DIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          cosign attest --yes --type spdxjson --predicate "${SBOM_DIR}/sbom-amd64.spdx.json" "${IMAGE}@${AMD64}"
          cosign attest --yes --type spdxjson --predicate "${SBOM_DIR}/sbom-arm64.spdx.json" "${IMAGE}@${ARM64}"

      - name: Attest the build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # The identity is this workflow file of this repository at exactly the ref of this run, issued by GitHub's
      # OIDC provider, and the provenance must name this ref and commit. Anything else fails the run.
      - name: Verify signature, SBOMs and provenance
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          AMD64: ${{ steps.platforms.outputs.amd64 }}
          ARM64: ${{ steps.platforms.outputs.arm64 }}
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          identity="https://github.com/${REPOSITORY}/.github/workflows/images.yml@${GITHUB_REF}"
          issuer="https://token.actions.githubusercontent.com"
          cosign verify \
            --certificate-identity "${identity}" \
            --certificate-oidc-issuer "${issuer}" \
            "${IMAGE}@${DIGEST}" > /dev/null
          for child in "${AMD64}" "${ARM64}"; do
            cosign verify-attestation --type spdxjson \
              --certificate-identity "${identity}" \
              --certificate-oidc-issuer "${issuer}" \
              "${IMAGE}@${child}" > /dev/null
          done
          gh attestation verify "oci://${IMAGE}@${DIGEST}" \
            --repo "${REPOSITORY}" \
            --signer-workflow "${REPOSITORY}/.github/workflows/images.yml" \
            --source-ref "${GITHUB_REF}" --source-digest "${GITHUB_SHA}"

      - name: Show the digest
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "${IMAGE}@${DIGEST}" >> "$GITHUB_STEP_SUMMARY"
