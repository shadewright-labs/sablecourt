name: Images

# Builds the daemon and agent targets of the Dockerfile for linux/amd64 and linux/arm64 and publishes them as
# ghcr.io/<owner>/sablecourt (daemon) and ghcr.io/<owner>/sablecourt-agent from main and v* tags. The pull request
# build (amd64 only, no push, no write permission) is images-build.yml, called by ci.yml; it is a separate file
# because a called workflow may not contain a job that asks for more permissions than its caller grants, and this
# file's identity is what the signatures are verified against. Tags are cut by release-please or, for a
# pre-release, by hand (see docs/ci-and-releases.md).
#
# - gate: a tag must point at a commit on main (hack/require-on-main.sh) and be one the release process makes
#   (hack/check-release-tag.sh). When the tag's GitHub release is already published (hack/release-state.sh) the
#   run writes nothing and only verifies the published images (verify-published); any error reading the release
#   fails the gate.
# - build (one job per image): pushes the image index BY DIGEST ONLY, with no tag, then signs it with cosign
#   keyless (GitHub OIDC), attests an SPDX SBOM per platform image (Syft from hack/install-syft.sh) and records a
#   GitHub build provenance attestation. Buildx and the BuildKit image are pinned (hack/setup-buildx.sh).
# - verify: checks both indexes by digest (hack/verify-image.sh): signature, the SBOM of each platform and the
#   provenance, against this workflow at exactly this ref, with provenance bound to this ref and commit. A
#   failure here leaves no tag of this run on any image.
# - promote: one job for both images, in a concurrency group that runs one promotion of tags (and, separately,
#   one of main) at a time and never cancels a running one. It reads the release state and the tags again, then
#   applies the run's tags and the floating tags with `docker buildx imagetools create` (hack/promote-images.sh):
#   main gets main and sha-<commit>; vX.Y.Z gets X.Y.Z, plus X.Y and latest only when no newer stable tag exists
#   in that line or at all at that moment (hack/floating-tags.sh); vX.Y.Z-rc.N gets only X.Y.Z-rc.N.
# Only build and promote can write packages; only build has id-token and attestations: write. None of it runs for
# a pull request (forks included).
on:
  push:
    branches: [main]
    tags: ["v*"]

permissions: {}

jobs:
  gate:
    name: Check the ref
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      published: ${{ steps.state.outputs.published || 'false' }}
    steps:
      # The history of main and all tags are fetched for the checks below.
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Require the tag to be on main
        if: github.ref_type == 'tag'
        run: hack/require-on-main.sh HEAD origin/main

      - name: Require a release tag
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: hack/check-release-tag.sh "${TAG}"

      - name: Check whether the release is already published
        id: state
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: hack/release-state.sh "${REPOSITORY}" "${TAG}" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.image }}
    needs: gate
    if: github.event_name == 'push' && needs.gate.outputs.published == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: sablecourt
            target: daemon
          - image: sablecourt-agent
            target: agent
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Buildx and BuildKit (pinned)
        run: hack/setup-buildx.sh

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # Labels only: the tags are applied by the promote job, after verification.
      - name: Compute labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}

      # The builder stage runs on the build host and cross-compiles (CGO is off), and the final stages only copy
      # the binary, so the arm64 image needs no emulation. push-by-digest: the index gets no tag here.
      - name: Build and push both architectures by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign the image (keyless)
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE,,}@${DIGEST}"

      # The index has one image per platform; the SBOM is made and attested per platform image, because the
      # packages can differ. The children come from the index manifest, by digest.
      - name: Resolve the platform images
        id: platforms
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: hack/image-platform-digests.sh "${IMAGE,,}@${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Install Syft
        run: hack/install-syft.sh "${RUNNER_TEMP}/syft-bin"

      # Syft scans the image it is given by its own digest, so each SBOM describes exactly that platform.
      - name: Generate and attest the SPDX SBOMs
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          AMD64: ${{ steps.platforms.outputs.amd64 }}
          ARM64: ${{ steps.platforms.outputs.arm64 }}
        run: |
          set -euo pipefail
          image="${IMAGE,,}"
          for pair in "amd64=${AMD64}" "arm64=${ARM64}"; do
            arch="${pair%%=*}" child="${pair#*=}"
            sbom="${RUNNER_TEMP}/sbom-${arch}.spdx.json"
            "${RUNNER_TEMP}/syft-bin/syft" scan "registry:${image}@${child}" -o "spdx-json=${sbom}"
            cosign attest --yes --type spdxjson --predicate "${sbom}" "${image}@${child}"
          done

      - name: Attest the build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Keep the digest for the verify job
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/digest"
          printf '%s' "${DIGEST}" | grep -Eq '^sha256:[a-f0-9]{64}$'
          printf '%s\n' "${DIGEST}" > "${RUNNER_TEMP}/digest/${IMAGE}"

      - name: Upload the digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.image }}
          path: ${{ runner.temp }}/digest/${{ matrix.image }}
          if-no-files-found: error
          retention-days: 7

  # Read-only: checks both images by digest before any tag exists.
  verify:
    name: Verify both images
    needs: [gate, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
      attestations: read
    outputs:
      daemon: ${{ steps.verify.outputs.daemon }}
      agent: ${{ steps.verify.outputs.agent }}
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          merge-multiple: true
          path: ${{ runner.temp }}/digest

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Log in to GHCR
        env:
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ github.token }}
        run: printf '%s' "${TOKEN}" | docker login ghcr.io --username "${ACTOR}" --password-stdin

      - name: Verify signature, SBOMs and provenance
        id: verify
        env:
          OWNER: ${{ github.repository_owner }}
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for pair in daemon:sablecourt agent:sablecourt-agent; do
            key="${pair%%:*}" image="${pair#*:}"
            digest="$(cat "${RUNNER_TEMP}/digest/${image}")"
            hack/verify-image.sh "${REPOSITORY}" "${GITHUB_REF}" "${GITHUB_SHA}" "ghcr.io/${OWNER,,}/${image}@${digest}"
            echo "${key}=${digest}" >> "${GITHUB_OUTPUT}"
          done

  # The only job that moves tags. One promotion at a time per kind of ref (tags, or main): a later run waits for a
  # running one and never cancels it. GitHub keeps at most one run waiting per group: a third run replaces the
  # waiting one, which then ends cancelled (not green) and applies nothing; re-run it.
  promote:
    name: Promote both images
    needs: [gate, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: images-promote-${{ github.repository }}-${{ github.ref_type }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Buildx (pinned)
        run: hack/setup-buildx.sh --plugin-only

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # Read again now that this job holds the group: a release published meanwhile is not touched, and the
      # floating tags are decided from the tags that exist at this moment.
      - name: Check the release again and fetch the tags
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          state="$(hack/release-state.sh "${REPOSITORY}" "${TAG}")"
          if [ "${state}" != "published=false" ]; then
            echo "release ${TAG} was published while this run was building; not moving any tag" >&2
            exit 1
          fi
          git fetch --force --tags origin

      - name: Apply the tags
        env:
          OWNER: ${{ github.repository_owner }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          DAEMON: ${{ needs.verify.outputs.daemon }}
          AGENT: ${{ needs.verify.outputs.agent }}
        run: |
          set -euo pipefail
          hack/promote-images.sh "${OWNER}" "${REF_TYPE}" "${REF_NAME}" "${GITHUB_SHA}" "${DAEMON}" "${AGENT}" | tee -a "${GITHUB_STEP_SUMMARY}"

  # A rerun after publication writes nothing, but ends green only when the published images still verify:
  # the version tags must name images signed, SBOM-attested and with provenance from this tag and commit.
  verify-published:
    name: Verify the published images
    needs: gate
    if: github.ref_type == 'tag' && needs.gate.outputs.published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
      attestations: read
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Log in to GHCR
        env:
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ github.token }}
        run: printf '%s' "${TOKEN}" | docker login ghcr.io --username "${ACTOR}" --password-stdin

      - name: Verify the version tags
        env:
          TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ github.token }}
        run: WAIT_SECONDS=0 hack/resolve-image-digests.sh "${TAG}" "${REPOSITORY}" "${OWNER}" "${GITHUB_SHA}"
