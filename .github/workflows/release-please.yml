name: Release

# Keeps one release pull request up to date from the Conventional Commits on main (AGENTS.md, "Working rules").
# Merging it tags vX.Y.Z, updates CHANGELOG.md and creates a draft GitHub release (draft and
# force-tag-creation in release-please-config.json). The App token makes the tag push trigger workflows: the
# tag starts images.yml (images, signatures, SBOMs, provenance), release.yml (binaries, checksums and their
# signature, then the digests and verify commands in the release body, then publishing the draft) and
# trivy.yml. release-please finds its last release by the version in .release-please-manifest.json, so a
# hand-made pre-release tag such as v0.2.0-rc.1 does not affect the next release.
#
# The token comes from a GitHub App, not GITHUB_TOKEN, because pull requests opened with GITHUB_TOKEN do not
# trigger workflows and the required checks would never run on the release pull request. The App's client ID
# is the repository variable RELEASE_APP_CLIENT_ID and its private key the secret RELEASE_APP_PRIVATE_KEY of the
# `release` environment, which only deployments from main can use. When either is missing the job fails and
# says which one.
on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    steps:
      - name: Require the App credentials
        env:
          CLIENT_ID: ${{ vars.RELEASE_APP_CLIENT_ID }}
          PRIVATE_KEY_SET: ${{ secrets.RELEASE_APP_PRIVATE_KEY != '' }}
        run: |
          set -euo pipefail
          missing=""
          [ -n "${CLIENT_ID}" ] || missing="${missing} the variable RELEASE_APP_CLIENT_ID"
          [ "${PRIVATE_KEY_SET}" = true ] || missing="${missing} the secret RELEASE_APP_PRIVATE_KEY"
          if [ -n "${missing}" ]; then
            echo "::error::release-please needs the release App: set${missing} (environment 'release'); see docs/ci-and-releases.md"
            exit 1
          fi

      - name: Mint a short-lived App token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - name: Release please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
