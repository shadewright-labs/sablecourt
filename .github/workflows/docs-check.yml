name: Docs check

# Checks that the reference pages under docs/reference match the code (make docs-check, the same tests go test
# runs) and that every relative link in the tracked Markdown files points at a file and heading that exist
# (hack/docs-links.py check; pages not written yet are listed in hack/docs-pages-pending.txt). External links
# are reported weekly by docs-links.yml.
# Called by ci.yml (the only trigger), which decides from the changed files whether it runs.
on:
  workflow_call:
    inputs:
      run:
        description: Whether the job runs; ci.yml passes false when no file of this group changed.
        type: boolean
        default: true

permissions: {}

env:
  GOFLAGS: -mod=readonly
  GOWORK: off

jobs:
  docs-check:
    if: ${{ inputs.run != false }}
    name: docs check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: Check the reference pages
        run: make docs-check

      - name: Check internal links
        run: python3 -I hack/docs-links.py check
