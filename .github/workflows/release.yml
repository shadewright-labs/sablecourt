name: Release Binaries and Container Images

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release version without leading v: X.Y.Z or X.Y.Z-rc.N"
        required: true
        default: "0.1.0"

permissions: {}

jobs:
  binaries:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release and upload the archives
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Resolve version
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            VER="${INPUT_TAG}"
          else
            VER="${GITHUB_REF_NAME#v}"
          fi
          # X.Y.Z or X.Y.Z-rc.N: the tags hack/check-image-refs.sh accepts in this repository.
          if ! printf '%s' "${VER}" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-rc\.[1-9][0-9]*)?$'; then
            echo "version '${VER}' is not X.Y.Z or X.Y.Z-rc.N" >&2
            exit 1
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VER}" >> "$GITHUB_OUTPUT"

      - name: Build cross-platform archives
        env:
          VER: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64; do
            GOOS="${target%/*}"
            GOARCH="${target#*/}"
            STAGE="dist/stage-${GOOS}-${GOARCH}"
            mkdir -p "${STAGE}"
            CGO_ENABLED=0 GOOS="${GOOS}" GOARCH="${GOARCH}" go build -trimpath -ldflags="-s -w" -o "${STAGE}/sablecourtd" ./cmd/sablecourtd
            CGO_ENABLED=0 GOOS="${GOOS}" GOARCH="${GOARCH}" go build -trimpath -ldflags="-s -w -X main.version=${VER}" -o "${STAGE}/sablectl" ./cmd/sablectl
            tar -C "${STAGE}" -czf "dist/sablecourt_${VER}_${GOOS}_${GOARCH}.tar.gz" sablecourtd sablectl
            rm -rf "${STAGE}"
          done
          (cd dist && sha256sum -- *.tar.gz > checksums.txt)

      # Creates the release with generated notes, or adds the files to a release that already exists for the
      # tag, so a rerun replaces the assets instead of failing.
      # A release candidate (X.Y.Z-rc.N) is created as a pre-release.
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.meta.outputs.tag }}
          VER: ${{ steps.meta.outputs.version }}
        run: |
          pre=()
          case "${VER}" in *-*) pre=(--prerelease) ;; esac
          if gh release view "${TAG}" > /dev/null 2>&1; then
            gh release upload "${TAG}" dist/*.tar.gz dist/checksums.txt --clobber
          else
            gh release create "${TAG}" --generate-notes "${pre[@]}" dist/*.tar.gz dist/checksums.txt
          fi

  containers:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push the images to GHCR
    env:
      DAEMON_IMAGE: ghcr.io/shadewright-labs/sablecourt
      AGENT_IMAGE: ghcr.io/shadewright-labs/sablecourt-agent
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      # The same pinned Buildx and BuildKit as the pull request image build (images-build.yml).
      - name: Set up Docker Buildx
        run: hack/setup-buildx.sh

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tag
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG="${INPUT_TAG}"
          else
            TAG="${GITHUB_REF_NAME#v}"
          fi
          if ! printf '%s' "${TAG}" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-rc\.[1-9][0-9]*)?$'; then
            echo "version '${TAG}' is not X.Y.Z or X.Y.Z-rc.N" >&2
            exit 1
          fi
          # A release candidate does not move latest.
          {
            echo "daemon<<EOF"
            echo "${DAEMON_IMAGE}:${TAG}"
            case "${TAG}" in *-*) ;; *) echo "${DAEMON_IMAGE}:latest" ;; esac
            echo "EOF"
            echo "agent<<EOF"
            echo "${AGENT_IMAGE}:${TAG}"
            case "${TAG}" in *-*) ;; *) echo "${AGENT_IMAGE}:latest" ;; esac
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push sablecourtd (multi-arch)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          target: daemon
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.daemon }}

      - name: Build and push sablecourt-agent (multi-arch)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          target: agent
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.agent }}
