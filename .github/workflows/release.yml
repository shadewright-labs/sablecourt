name: Release assets

# Runs on every v* tag: the release tag that merging the release pull request creates (release-please.yml), or a
# pre-release tag vX.Y.Z-rc.N pushed by hand (docs/ci-and-releases.md). It completes the draft GitHub release of
# the tag and publishes it:
#
# - gate: checks the tag is on main (hack/require-on-main.sh) and is a tag the release process makes
#   (hack/check-release-tag.sh), and reads the release state (hack/release-state.sh; any error but "not found"
#   fails). When the release is already published, no job below writes anything: only verify-published runs,
#   and the run ends green only if that release passes the full verification.
# - build: builds sablecourtd and sablectl for darwin
#   and linux, amd64 and arm64 (hack/package-binaries.sh: sablecourt_<version>_<os>_<arch>.tar.gz and
#   checksums.txt). No permission beyond contents: read, no Go cache.
# - sign: signs checksums.txt keyless with cosign (checksums.txt.sigstore.json, GitHub OIDC, no key to store),
#   records a GitHub build provenance attestation per archive, and verifies both against the identity of this
#   workflow at exactly this tag and commit. The only job with id-token and attestations: write; it sees only the built files.
# - images: resolves the tag's sablecourt and sablecourt-agent images and verifies their signatures, SBOMs and
#   build provenance against images.yml on this tag and commit (hack/resolve-image-digests.sh), waiting up to 30
#   minutes for the Images run to promote them.
# - upload: uploads the archives, checksums.txt and the bundle to the draft release (hack/upload-release-assets.sh:
#   waits up to five minutes for the draft, reads the draft state before every attempt and refuses anything but a
#   draft, re-uploads with --clobber on a rerun).
# - release-notes: appends the image digests and the verify commands to the release body, between markers
#   (hack/release-verify-notes.sh), so a rerun replaces the section.
# - publish-release: publishes the draft only when it has a boolean draft state, its pre-release flag matches the
#   tag, the exact section is present and its assets are exactly the six files the build and sign jobs made, with
#   their digests (hack/publish-release.sh, which reads the draft again just before publishing); otherwise it
#   fails and leaves the draft unpublished.
# - verify-published (only when the gate found the release published): downloads the release's assets, verifies
#   the checksums signature, the checksums and each archive's provenance against release.yml at this tag and
#   commit, resolves and verifies both images, and requires the exact asset set and the notes section for those
#   digests (hack/publish-release.sh verify-only). It has no write permission.
#
# No `release: published` trigger anywhere: creating a draft emits no such event, and a release published with
# GITHUB_TOKEN does not trigger other workflows. Only upload, release-notes and publish-release have
# contents: write, and none of them builds or signs anything.
on:
  push:
    tags: ["v*"]

permissions: {}

env:
  GOFLAGS: -mod=readonly
  GOWORK: off

jobs:
  gate:
    name: Check the tag
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      published: ${{ steps.state.outputs.published }}
    steps:
      # The history of main is fetched for the on-main check.
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Require the tag to be on main
        run: hack/require-on-main.sh HEAD origin/main

      - name: Require a release tag
        env:
          TAG: ${{ github.ref_name }}
        run: hack/check-release-tag.sh "${TAG}"

      # With this read-only token a draft is not visible, so a draft reads as not published; that is the case
      # in which the run should go on.
      - name: Check whether the release is already published
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: hack/release-state.sh "${REPOSITORY}" "${TAG}" >> "$GITHUB_OUTPUT"

  build:
    name: Build the archives
    needs: [gate]
    if: needs.gate.outputs.published == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false # a release build must not read a cache that another run could have written

      - name: Build and pack the archives
        env:
          TAG: ${{ github.ref_name }}
        run: hack/package-binaries.sh "${TAG}" "${RUNNER_TEMP}/dist"

      - name: Keep the archives for the next jobs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dist
          path: ${{ runner.temp }}/dist/
          if-no-files-found: error
          retention-days: 7

  sign:
    name: Sign and attest
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # cosign keyless signing and the provenance attestation, this job only
      attestations: write
    steps:
      - name: Download the archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dist
          path: ${{ runner.temp }}/dist

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      # checksums.txt lists every archive, so one signature covers all four.
      - name: Sign checksums.txt (keyless)
        env:
          DIST: ${{ runner.temp }}/dist
        run: cosign sign-blob --yes --bundle "${DIST}/checksums.txt.sigstore.json" "${DIST}/checksums.txt"

      - name: Attest the build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/dist/sablecourt_*.tar.gz

      # The identity is this workflow file of this repository at exactly this tag, issued by GitHub's OIDC
      # provider, and the provenance must name this tag and commit. Anything else fails the run.
      - name: Verify the signature, the checksums and the provenance
        env:
          DIST: ${{ runner.temp }}/dist
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          identity="https://github.com/${REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}"
          cosign verify-blob \
            --bundle "${DIST}/checksums.txt.sigstore.json" \
            --certificate-identity "${identity}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${DIST}/checksums.txt"
          (cd "${DIST}" && sha256sum --check --strict checksums.txt)
          for archive in "${DIST}"/sablecourt_*.tar.gz; do
            gh attestation verify "${archive}" \
              --repo "${REPOSITORY}" \
              --signer-workflow "${REPOSITORY}/.github/workflows/release.yml" \
              --source-ref "${GITHUB_REF}" --source-digest "${GITHUB_SHA}"
          done

      - name: Keep the signature bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-signature
          path: ${{ runner.temp }}/dist/checksums.txt.sigstore.json
          if-no-files-found: error
          retention-days: 7

  # Resolves the image pair of the tag once, verified (signature, SBOM attestations and build provenance against
  # the Images workflow on this tag). packages: read only for private packages; attestations: read for the
  # provenance; no write, no OIDC token.
  images:
    name: Resolve and verify the image digests
    needs: [gate]
    if: needs.gate.outputs.published == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Digests only, not secrets.
    outputs:
      daemon: ${{ steps.resolve.outputs.daemon }}
      agent: ${{ steps.resolve.outputs.agent }}
    permissions:
      contents: read
      packages: read
      attestations: read
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Log in to GHCR
        env:
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ github.token }}
        run: printf '%s' "${TOKEN}" | docker login ghcr.io --username "${ACTOR}" --password-stdin

      - name: Resolve and verify the signed image digests
        id: resolve
        env:
          TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          hack/resolve-image-digests.sh "${TAG}" "${REPOSITORY}" "${OWNER}" "${GITHUB_SHA}" | tee "${RUNNER_TEMP}/digests.txt" >> "${GITHUB_OUTPUT}"
          cat "${RUNNER_TEMP}/digests.txt" >> "${GITHUB_STEP_SUMMARY}"

  # The first job with contents: write. It runs no build and no signing: it uploads the files the jobs above made.
  upload:
    name: Upload to the release
    needs: [build, sign]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # upload the release assets of this tag
    steps:
      - name: Download the archives and the signature
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: ${{ runner.temp }}/dist

      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Upload the assets
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          DIST: ${{ runner.temp }}/dist
        run: hack/upload-release-assets.sh "${REPOSITORY}" "${TAG}" "${DIST}" | tee -a "${GITHUB_STEP_SUMMARY}"

  release-notes:
    name: Add digests and verify steps to the release
    needs: [images, upload]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # edit the release body of this tag
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Append the digests and the verify commands to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          DAEMON: ${{ needs.images.outputs.daemon }}
          AGENT: ${{ needs.images.outputs.agent }}
        run: |
          set -euo pipefail
          body="${RUNNER_TEMP}/body.md"
          notes="${RUNNER_TEMP}/notes.md"
          # Edit only a draft: a published release is never rewritten.
          [ "$(gh release view "${TAG}" --json isDraft --jq .isDraft)" = true ] || { echo "release ${TAG} is not a draft; not editing it" >&2; exit 1; }
          gh release view "${TAG}" --json body --jq .body > "${body}"
          hack/release-verify-notes.sh "${GH_REPO}" "${TAG}" "${DAEMON}" "${AGENT}" "${GITHUB_SHA}" < "${body}" > "${notes}"
          gh release edit "${TAG}" --notes-file "${notes}"
          echo "release ${TAG}: digests and verify commands added" >> "${GITHUB_STEP_SUMMARY}"

  publish-release:
    name: Publish the complete release
    needs: [images, release-notes]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # inspect the assets and publish the draft, no registry or OIDC access
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The files this run built and signed: each uploaded asset must have the same sha256 digest.
      - name: Download the archives and the signature
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: ${{ runner.temp }}/dist

      - name: Require all artifacts and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          DAEMON: ${{ needs.images.outputs.daemon }}
          AGENT: ${{ needs.images.outputs.agent }}
          DIST: ${{ runner.temp }}/dist
        run: hack/publish-release.sh "${GH_REPO}" "${TAG}" "${DAEMON}" "${AGENT}" "${GITHUB_SHA}" "${DIST}"

  # A rerun after publication: nothing is written, and the run is green only if the public release checks out.
  verify-published:
    name: Verify the published release
    needs: [gate]
    if: needs.gate.outputs.published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read # read the release and download its assets
      packages: read
      attestations: read
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Log in to GHCR
        env:
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ github.token }}
        run: printf '%s' "${TOKEN}" | docker login ghcr.io --username "${ACTOR}" --password-stdin

      - name: Verify the binaries
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          dist="${RUNNER_TEMP}/published"
          mkdir -p "${dist}"
          gh release download "${TAG}" --repo "${REPOSITORY}" --dir "${dist}"
          identity="https://github.com/${REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}"
          cosign verify-blob \
            --bundle "${dist}/checksums.txt.sigstore.json" \
            --certificate-identity "${identity}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${dist}/checksums.txt"
          (cd "${dist}" && sha256sum --check --strict checksums.txt)
          for archive in "${dist}"/sablecourt_*.tar.gz; do
            gh attestation verify "${archive}" \
              --repo "${REPOSITORY}" \
              --signer-workflow "${REPOSITORY}/.github/workflows/release.yml" \
              --source-ref "${GITHUB_REF}" --source-digest "${GITHUB_SHA}"
          done

      - name: Verify the images
        id: images
        env:
          TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ github.token }}
        run: WAIT_SECONDS=0 hack/resolve-image-digests.sh "${TAG}" "${REPOSITORY}" "${OWNER}" "${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"

      # Exactly the six assets (an extra one fails), each with the digest of the verified download, and the
      # notes section for the verified image digests. verify-only never writes.
      - name: Require the complete release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          DAEMON: ${{ steps.images.outputs.daemon }}
          AGENT: ${{ steps.images.outputs.agent }}
        run: hack/publish-release.sh "${REPOSITORY}" "${TAG}" "${DAEMON}" "${AGENT}" "${GITHUB_SHA}" "${RUNNER_TEMP}/published" verify-only
