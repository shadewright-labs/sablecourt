# Weekly dependency updates. Titles follow Conventional Commits (chore(deps), ci(deps)) so they pass the
# PR title check. A person reviews and merges every update.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 5
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      go-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
  # Every Dockerfile in the tree: the release images (root) and the harness, proxy and example images.
  - package-ecosystem: docker
    directories:
      - /
      - /cmd/sablecourt-agent
      - /examples/demo-agent
      - /internal/gate/councilproxy
      - /internal/harnessimages
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 5
    commit-message:
      prefix: chore
      include: scope
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 5
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ["*"]
