<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 730" role="img" aria-labelledby="t d" data-diagram="nested" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="t">A2A task envelope fields</title>
  <desc id="d">The fields of a task envelope as domain.Task holds them today, grouped by who fills them. The callers of SubmitTask (the API, A2A, the dashboard, a webhook and the scheduler) pass the target workload name, the input JSON and an optional idempotency key, which becomes the task ID when empty. A solid line labelled SubmitTask leads to the control plane group, which generates the task ID, sets the state, which starts as submitted and which the control plane moves, sets the parent link when a workflow starts its next step, and records the artifacts when the task finishes. A red note says SubmitTask takes no task ID, state or artifacts. A dashed planned group shows a workload proposing a child task: ProposeChildTask would check a delegate grant and store a sub-budget ceiling as given, without checking it against the parent cap; it has no caller yet, and a dashed line labelled proposes a child task, planned, leads from it to the control plane group. A last group, from the manifest, holds the agent card description and skills for each workload. A legend marks built and planned.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2dd4bf"/></marker>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#8a8594"/></marker>
    <marker id="x" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#f87171"/></marker>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2dd4bf" stop-opacity=".22"/><stop offset="1" stop-color="#2dd4bf" stop-opacity=".06"/></linearGradient>
    <style>
      .lane{fill:#111422;stroke:#373040}
      .lanet{fill:#8a8594;font-size:13px;font-weight:600;letter-spacing:.14em}
      .box{fill:#14111c;stroke:#8a8594;stroke-width:1.2}
      .key{fill:url(#glow);stroke:#2dd4bf;stroke-width:1.6}
      .ext{fill:#14111c;stroke:#7fd6b4;stroke-width:1.2}
      .plan{fill:#14111c;stroke:#8a8594;stroke-width:1.2;stroke-dasharray:5 4}
      .wait{fill:#14111c;stroke:#f0b86a;stroke-width:1.2}
      .bad{fill:#14111c;stroke:#f87171;stroke-width:1.2}
      .frame{fill:none;stroke:#bbb4c5;stroke-dasharray:5 5;stroke-width:1.2}
      .h{fill:#efe9dc;font-size:15px;font-weight:650}
      .s{fill:#bbb4c5;font-size:12.5px}
      .cap{fill:#8a8594;font-size:12.5px}
      .pn{fill:#8a8594;font-size:12px;font-weight:600;letter-spacing:.06em}
      .n{fill:#2dd4bf;font-size:12px;font-weight:700;letter-spacing:.08em}
      .idt{fill:#bbb4c5;font-size:12px;font-weight:600;letter-spacing:.06em}
      .lbl{fill:#bbb4c5;font-size:12px}
      .no{fill:#f87171;font-size:13px;font-weight:600}
      .f{stroke:#2dd4bf;stroke-width:1.8;fill:none}
      .r{stroke:#8a8594;stroke-width:1.4;fill:none;stroke-dasharray:4 4}
      .deny{stroke:#f87171;stroke-width:1.4;fill:none;stroke-dasharray:4 4}
      .life{stroke:#373040;stroke-width:1.2;fill:none;stroke-dasharray:4 4}
    </style>
  </defs>
  <rect width="1120" height="730" rx="18" fill="#08060e"/>
  <rect class="lane" x="24" y="24" width="1072" height="150" rx="14"/>
  <text class="lanet" x="44" y="54">PASSED TO SubmitTask BY ITS CALLERS (API, A2A, DASHBOARD, WEBHOOK, SCHEDULER)</text>
  <rect class="box" x="44" y="76" width="320" height="72" rx="10"/>
  <text class="h" x="60" y="102">Target workload</text>
  <text class="s" x="60" y="123">a workload name from the manifest</text>
  <rect class="box" x="400" y="76" width="320" height="72" rx="10"/>
  <text class="h" x="416" y="102">Input</text>
  <text class="s" x="416" y="123">input JSON for the task</text>
  <rect class="box" x="756" y="76" width="312" height="72" rx="10"/>
  <text class="h" x="772" y="102">Idempotency key</text>
  <text class="s" x="772" y="123">optional</text>
  <text class="s" x="772" y="140">empty becomes the task ID</text>
  <path class="f" d="M560 174V210" marker-end="url(#a)"/>
  <text class="lbl" x="572" y="198" text-anchor="start">SubmitTask</text>
  <rect class="lane" x="24" y="214" width="1072" height="150" rx="14"/>
  <text class="lanet" x="44" y="244">SET BY THE CONTROL PLANE</text>
  <rect class="box" x="44" y="266" width="238" height="72" rx="10"/>
  <text class="h" x="60" y="292">Task ID</text>
  <text class="s" x="60" y="313">generated for each task</text>
  <rect class="box" x="306" y="266" width="238" height="72" rx="10"/>
  <text class="h" x="322" y="292">State</text>
  <text class="s" x="322" y="313">starts as submitted</text>
  <text class="s" x="322" y="330">the control plane moves it</text>
  <rect class="box" x="568" y="266" width="238" height="72" rx="10"/>
  <text class="h" x="584" y="292">Parent link</text>
  <text class="s" x="584" y="313">set when a workflow</text>
  <text class="s" x="584" y="330">starts its next step</text>
  <rect class="box" x="830" y="266" width="238" height="72" rx="10"/>
  <text class="h" x="846" y="292">Artifacts</text>
  <text class="s" x="846" y="313">typed output of the task</text>
  <text class="s" x="846" y="330">recorded when it finishes</text>
  <text class="no" x="44" y="356" text-anchor="start">SubmitTask takes no task ID, state or artifacts</text>
  <path class="r" d="M560 404V368" marker-end="url(#m)"/>
  <text class="lbl" x="572" y="392" text-anchor="start">proposes a child task (planned)</text>
  <rect class="lane" x="24" y="404" width="1072" height="140" rx="14" stroke-dasharray="5 4"/>
  <text class="lanet" x="44" y="434">PLANNED: A WORKLOAD PROPOSES A CHILD TASK</text>
  <rect class="plan" x="44" y="456" width="320" height="72" rx="10"/>
  <text class="h" x="60" y="482">Delegate grant</text>
  <text class="s" x="60" y="503">checked before the child is created</text>
  <rect class="plan" x="400" y="456" width="320" height="72" rx="10"/>
  <text class="h" x="416" y="482">Sub-budget ceiling</text>
  <text class="s" x="416" y="503">stored as given on the child</text>
  <text class="s" x="416" y="520">parent cap check not built</text>
  <text class="cap" x="744" y="496" text-anchor="start">ProposeChildTask has no caller yet</text>
  <rect class="lane" x="24" y="564" width="1072" height="100" rx="14"/>
  <text class="lanet" x="44" y="594">FROM THE MANIFEST</text>
  <rect class="box" x="44" y="608" width="320" height="42" rx="10"/>
  <text class="h" x="60" y="635">Agent card</text>
  <text class="cap" x="400" y="635" text-anchor="start">description and skills, recorded for each workload</text>
  <path class="f" d="M24 696H64" marker-end="url(#a)"/>
  <text class="lbl" x="74" y="700" text-anchor="start">built</text>
  <path class="r" d="M200 696H240" marker-end="url(#m)"/>
  <text class="lbl" x="250" y="700" text-anchor="start">planned</text>
</svg>
