<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 580" role="img" aria-labelledby="t d" data-diagram="nested" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="t">A2A task envelope fields</title>
  <desc id="d">The fields of a task envelope, grouped by who fills them. The proposing workload supplies the target workload, which needs a delegate grant, the input prompt, an optional idempotency key that is filled in if left empty, and a sub-budget ceiling kept on the child task, drawn dashed because the check against the parent cap is not built. A line labelled proposes a child task leads to the control plane group, which sets the task ID, the state that starts as submitted, the parent link to the proposing task, and the artifacts recorded when the task finishes. A red note says a workload never sets the task ID, the state or the artifacts. A third group, from the manifest, holds the agent card with workload ID, class, skills, schemas and allowed gates, recorded for each workload. A legend marks built and planned.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2dd4bf"/></marker>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#8a8594"/></marker>
    <marker id="x" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#f87171"/></marker>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2dd4bf" stop-opacity=".22"/><stop offset="1" stop-color="#2dd4bf" stop-opacity=".06"/></linearGradient>
    <style>
      .lane{fill:#111422;stroke:#373040}
      .lanet{fill:#8a8594;font-size:13px;font-weight:600;letter-spacing:.14em}
      .box{fill:#14111c;stroke:#8a8594;stroke-width:1.2}
      .key{fill:url(#glow);stroke:#2dd4bf;stroke-width:1.6}
      .ext{fill:#14111c;stroke:#7fd6b4;stroke-width:1.2}
      .plan{fill:#14111c;stroke:#8a8594;stroke-width:1.2;stroke-dasharray:5 4}
      .wait{fill:#14111c;stroke:#f0b86a;stroke-width:1.2}
      .bad{fill:#14111c;stroke:#f87171;stroke-width:1.2}
      .frame{fill:none;stroke:#bbb4c5;stroke-dasharray:5 5;stroke-width:1.2}
      .h{fill:#efe9dc;font-size:15px;font-weight:650}
      .s{fill:#bbb4c5;font-size:12.5px}
      .cap{fill:#8a8594;font-size:12.5px}
      .pn{fill:#8a8594;font-size:12px;font-weight:600;letter-spacing:.06em}
      .n{fill:#2dd4bf;font-size:12px;font-weight:700;letter-spacing:.08em}
      .idt{fill:#bbb4c5;font-size:12px;font-weight:600;letter-spacing:.06em}
      .lbl{fill:#bbb4c5;font-size:12px}
      .no{fill:#f87171;font-size:13px;font-weight:600}
      .f{stroke:#2dd4bf;stroke-width:1.8;fill:none}
      .r{stroke:#8a8594;stroke-width:1.4;fill:none;stroke-dasharray:4 4}
      .deny{stroke:#f87171;stroke-width:1.4;fill:none;stroke-dasharray:4 4}
      .life{stroke:#373040;stroke-width:1.2;fill:none;stroke-dasharray:4 4}
    </style>
  </defs>
  <rect width="1120" height="580" rx="18" fill="#08060e"/>
  <rect class="lane" x="24" y="24" width="1072" height="150" rx="14"/>
  <text class="lanet" x="44" y="54">SUPPLIED BY THE PROPOSING WORKLOAD</text>
  <rect class="box" x="44" y="76" width="238" height="72" rx="10"/>
  <text class="h" x="60" y="102">Target workload</text>
  <text class="s" x="60" y="123">the workload to start</text>
  <text class="s" x="60" y="140">needs a delegate grant</text>
  <rect class="box" x="306" y="76" width="238" height="72" rx="10"/>
  <text class="h" x="322" y="102">Input</text>
  <text class="s" x="322" y="123">the prompt for the child</text>
  <rect class="box" x="568" y="76" width="238" height="72" rx="10"/>
  <text class="h" x="584" y="102">Idempotency key</text>
  <text class="s" x="584" y="123">optional</text>
  <text class="s" x="584" y="140">filled in if left empty</text>
  <rect class="plan" x="830" y="76" width="238" height="72" rx="10"/>
  <text class="h" x="846" y="102">Sub-budget ceiling</text>
  <text class="s" x="846" y="123">kept on the child task</text>
  <text class="s" x="846" y="140">parent cap check not built</text>
  <path class="f" d="M400 174V210" marker-end="url(#a)"/>
  <text class="lbl" x="412" y="198" text-anchor="start">proposes a child task</text>
  <rect class="lane" x="24" y="214" width="1072" height="150" rx="14"/>
  <text class="lanet" x="44" y="244">SET BY THE CONTROL PLANE</text>
  <rect class="box" x="44" y="266" width="238" height="72" rx="10"/>
  <text class="h" x="60" y="292">Task ID</text>
  <text class="s" x="60" y="313">new for each task</text>
  <rect class="box" x="306" y="266" width="238" height="72" rx="10"/>
  <text class="h" x="322" y="292">State</text>
  <text class="s" x="322" y="313">starts as submitted</text>
  <text class="s" x="322" y="330">the control plane moves it</text>
  <rect class="box" x="568" y="266" width="238" height="72" rx="10"/>
  <text class="h" x="584" y="292">Parent link</text>
  <text class="s" x="584" y="313">the proposing task</text>
  <text class="s" x="584" y="330">loaded by the control plane</text>
  <rect class="box" x="830" y="266" width="238" height="72" rx="10"/>
  <text class="h" x="846" y="292">Artifacts</text>
  <text class="s" x="846" y="313">typed output of the task</text>
  <text class="s" x="846" y="330">recorded when it finishes</text>
  <text class="no" x="44" y="356" text-anchor="start">never set by a workload: task ID, state, artifacts</text>
  <rect class="lane" x="24" y="404" width="1072" height="120" rx="14"/>
  <text class="lanet" x="44" y="434">FROM THE MANIFEST</text>
  <rect class="box" x="44" y="446" width="238" height="64" rx="10"/>
  <text class="h" x="60" y="472">Agent card</text>
  <text class="s" x="60" y="493">workload ID, class, skills</text>
  <text class="cap" x="306" y="484" text-anchor="start">schemas and allowed gates; recorded for each workload</text>
  <path class="f" d="M24 552H64" marker-end="url(#a)"/>
  <text class="lbl" x="74" y="556" text-anchor="start">built</text>
  <path class="r" d="M200 552H240" marker-end="url(#m)"/>
  <text class="lbl" x="250" y="556" text-anchor="start">planned</text>
</svg>
