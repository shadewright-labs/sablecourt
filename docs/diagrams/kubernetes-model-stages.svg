<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 384" role="img" aria-labelledby="t d" data-diagram="flow" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="t">Planned Citadel stages</title>
  <desc id="d">Five planned stages. C0, size S: decide and tidy, with ADRs, fixes to the existing manifests and a kind smoke test. C1, size M: sandboxed run pods with gVisor, default deny networking, lease exchange and API key inference. C2, size M: agentgateway behind the Model Gate, holding provider keys and emitting labelled token metrics. C3, size M: councils in the cluster, three pods per round and the writer branch pushed by the daemon; it can start after C1. C4, size L: shared installation with OIDC roles, a highly available store and signed audit heads; it needs C2 and C3. C0 leads to C1, C1 to C2, C2 to C4, C1 to C3 and C3 to C4.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2dd4bf"/></marker>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#8a8594"/></marker>
    <marker id="x" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#f87171"/></marker>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2dd4bf" stop-opacity=".22"/><stop offset="1" stop-color="#2dd4bf" stop-opacity=".06"/></linearGradient>
    <style>
      .lane{fill:#111422;stroke:#373040}
      .lanet{fill:#8a8594;font-size:13px;font-weight:600;letter-spacing:.14em}
      .box{fill:#14111c;stroke:#8a8594;stroke-width:1.2}
      .key{fill:url(#glow);stroke:#2dd4bf;stroke-width:1.6}
      .ext{fill:#14111c;stroke:#7fd6b4;stroke-width:1.2}
      .plan{fill:#14111c;stroke:#8a8594;stroke-width:1.2;stroke-dasharray:5 4}
      .wait{fill:#14111c;stroke:#f0b86a;stroke-width:1.2}
      .bad{fill:#14111c;stroke:#f87171;stroke-width:1.2}
      .frame{fill:none;stroke:#bbb4c5;stroke-dasharray:5 5;stroke-width:1.2}
      .h{fill:#efe9dc;font-size:15px;font-weight:650}
      .s{fill:#bbb4c5;font-size:12.5px}
      .cap{fill:#8a8594;font-size:12.5px}
      .pn{fill:#8a8594;font-size:12px;font-weight:600;letter-spacing:.06em}
      .n{fill:#2dd4bf;font-size:12px;font-weight:700;letter-spacing:.08em}
      .idt{fill:#bbb4c5;font-size:12px;font-weight:600;letter-spacing:.06em}
      .lbl{fill:#bbb4c5;font-size:12px}
      .no{fill:#f87171;font-size:13px;font-weight:600}
      .f{stroke:#2dd4bf;stroke-width:1.8;fill:none}
      .r{stroke:#8a8594;stroke-width:1.4;fill:none;stroke-dasharray:4 4}
      .deny{stroke:#f87171;stroke-width:1.4;fill:none;stroke-dasharray:4 4}
      .life{stroke:#373040;stroke-width:1.2;fill:none;stroke-dasharray:4 4}
    </style>
  </defs>
  <rect width="1120" height="384" rx="18" fill="#08060e"/>
  <rect class="plan" x="48" y="48" width="232" height="96" rx="10"/>
  <text class="n" x="64" y="74">C0, SIZE S</text>
  <text class="h" x="64" y="96">Decide and tidy</text>
  <text class="s" x="64" y="116">ADRs, fix the manifests</text>
  <text class="s" x="64" y="133">kind smoke test</text>
  <rect class="plan" x="328" y="48" width="232" height="96" rx="10"/>
  <text class="n" x="344" y="74">C1, SIZE M</text>
  <text class="h" x="344" y="96">Sandboxed run pods</text>
  <text class="s" x="344" y="116">gVisor, default deny</text>
  <text class="s" x="344" y="133">lease exchange, API keys</text>
  <rect class="plan" x="608" y="48" width="232" height="96" rx="10"/>
  <text class="n" x="624" y="74">C2, SIZE M</text>
  <text class="h" x="624" y="96">Gateway behind gate</text>
  <text class="s" x="624" y="116">keys in agentgateway</text>
  <text class="s" x="624" y="133">labelled token metrics</text>
  <rect class="plan" x="888" y="48" width="232" height="96" rx="10"/>
  <text class="n" x="904" y="74">C4, SIZE L</text>
  <text class="h" x="904" y="96">Shared installation</text>
  <text class="s" x="904" y="116">OIDC roles, HA store</text>
  <text class="s" x="904" y="133">signed audit heads</text>
  <rect class="plan" x="608" y="208" width="232" height="96" rx="10"/>
  <text class="n" x="624" y="234">C3, SIZE M</text>
  <text class="h" x="624" y="256">Councils in cluster</text>
  <text class="s" x="624" y="276">three pods per round</text>
  <text class="s" x="624" y="293">writer branch via daemon</text>
  <path class="f" d="M280 96H322" marker-end="url(#a)"/>
  <path class="f" d="M560 96H602" marker-end="url(#a)"/>
  <path class="f" d="M840 96H882" marker-end="url(#a)"/>
  <path class="f" d="M444 144V256H602" marker-end="url(#a)"/>
  <text class="lbl" x="452" y="248">after C1</text>
  <path class="f" d="M840 256H1004V150" marker-end="url(#a)"/>
  <text class="lbl" x="1012" y="200">needs C3</text>
  <text class="cap" x="48" y="352">Every stage is planned. Each box names the work and the acceptance theme; the page lists the checks.</text>
</svg>
