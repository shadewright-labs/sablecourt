<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 952" role="img" aria-labelledby="t d" data-diagram="nested" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="t">Planned Citadel cluster</title>
  <desc id="d">Planned layout of Sablecourt in a Kubernetes cluster. Outside the cluster: people with a browser or sablectl, an identity provider, a Git host and model providers. In the control namespace, sablecourtd holds the gates, leases, budgets, approvals and audit chain and stores state in PostgreSQL; people reach it with an OIDC session and it verifies ID tokens with the identity provider; it opens pull requests on the Git host and asks the Kubernetes API to create Jobs. The Kubernetes API starts harness pods in the run namespace, which denies traffic by default; the pods run under a gVisor sandbox runtime class, hold a lease file and a checkout and no provider keys, and make lease calls only to sablecourtd. sablecourtd forwards checked calls to agentgateway in the gateway namespace, which holds the provider keys and adds them before calling the model providers. agentgateway reports token usage to a metrics store in the monitoring namespace with team and workload labels, and Nightloom, outside Sablecourt, reads those cost labels. A direct path from a harness pod to the internet is denied. sablecourtd, PostgreSQL and the Kubernetes API exist in the tree today and are parked; every other box is planned.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2dd4bf"/></marker>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#8a8594"/></marker>
    <marker id="x" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#f87171"/></marker>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2dd4bf" stop-opacity=".22"/><stop offset="1" stop-color="#2dd4bf" stop-opacity=".06"/></linearGradient>
