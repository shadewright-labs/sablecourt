<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 492" role="img" aria-labelledby="t d" data-diagram="flow" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="t">Verifier verdict loop</title>
  <desc id="d">An author step passes its output to a verifier step, which reads it in a read-only checkout pinned to the author commit. The verifier ends with a verdict line, and a decision reads it. A PASS moves the workflow to the next step. A missing verdict halts the workflow with the reason verdict_missing, drawn in red. A CHANGES_REQUESTED verdict leads to a second decision, whether retries are left. If so, the author step runs again with the redacted findings as its handoff and the loop repeats. If not, no further step starts and the workflow stops, drawn in red. A legend marks the verifier step as the subject and the halting boxes.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2dd4bf"/></marker>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#8a8594"/></marker>
    <marker id="x" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#f87171"/></marker>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2dd4bf" stop-opacity=".22"/><stop offset="1" stop-color="#2dd4bf" stop-opacity=".06"/></linearGradient>
    <style>
      .lane{fill:#111422;stroke:#373040}
      .lanet{fill:#8a8594;font-size:13px;font-weight:600;letter-spacing:.14em}
      .box{fill:#14111c;stroke:#8a8594;stroke-width:1.2}
      .key{fill:url(#glow);stroke:#2dd4bf;stroke-width:1.6}
      .ext{fill:#14111c;stroke:#7fd6b4;stroke-width:1.2}
      .plan{fill:#14111c;stroke:#8a8594;stroke-width:1.2;stroke-dasharray:5 4}
      .wait{fill:#14111c;stroke:#f0b86a;stroke-width:1.2}
      .bad{fill:#14111c;stroke:#f87171;stroke-width:1.2}
      .frame{fill:none;stroke:#bbb4c5;stroke-dasharray:5 5;stroke-width:1.2}
      .h{fill:#efe9dc;font-size:15px;font-weight:650}
      .s{fill:#bbb4c5;font-size:12.5px}
      .cap{fill:#8a8594;font-size:12.5px}
      .pn{fill:#8a8594;font-size:12px;font-weight:600;letter-spacing:.06em}
      .n{fill:#2dd4bf;font-size:12px;font-weight:700;letter-spacing:.08em}
      .idt{fill:#bbb4c5;font-size:12px;font-weight:600;letter-spacing:.06em}
      .lbl{fill:#bbb4c5;font-size:12px}
      .no{fill:#f87171;font-size:13px;font-weight:600}
      .f{stroke:#2dd4bf;stroke-width:1.8;fill:none}
      .r{stroke:#8a8594;stroke-width:1.4;fill:none;stroke-dasharray:4 4}
      .deny{stroke:#f87171;stroke-width:1.4;fill:none;stroke-dasharray:4 4}
      .life{stroke:#373040;stroke-width:1.2;fill:none;stroke-dasharray:4 4}
    </style>
  </defs>
  <rect width="1120" height="492" rx="18" fill="#08060e"/>
  <rect class="bad" x="585" y="32" width="210" height="64" rx="10"/>
  <text class="h" x="601" y="58">Workflow halts</text>
  <text class="s" x="601" y="79">reason verdict_missing</text>
  <rect class="box" x="44" y="192" width="200" height="64" rx="10"/>
  <text class="h" x="60" y="218">Author step</text>
  <text class="s" x="60" y="239">writes the change</text>
  <rect class="key" x="316" y="188" width="210" height="72" rx="12"/>
  <text class="h" x="332" y="214">Verifier step</text>
  <text class="s" x="332" y="235">reads the author output</text>
  <text class="s" x="332" y="252">read-only pinned checkout</text>
  <rect class="box" x="858" y="192" width="210" height="64" rx="10"/>
  <text class="h" x="874" y="218">Next step</text>
  <text class="s" x="874" y="239">the workflow continues</text>
  <polygon class="box" points="600,224 690,168 780,224 690,280"/>
  <text class="s" x="690" y="229" text-anchor="middle">Verdict?</text>
  <polygon class="box" points="600,376 690,320 780,376 690,432"/>
  <text class="s" x="690" y="381" text-anchor="middle">Retries left?</text>
  <rect class="bad" x="858" y="344" width="210" height="64" rx="10"/>
  <text class="h" x="874" y="370">Stops</text>
  <text class="s" x="874" y="391">no further step starts</text>
  <path class="f" d="M244 224H310" marker-end="url(#a)"/>
  <text class="lbl" x="277" y="216" text-anchor="middle">output</text>
  <path class="f" d="M526 224H594" marker-end="url(#a)"/>
  <text class="lbl" x="560" y="216" text-anchor="middle">verdict</text>
  <path class="f" d="M780 224H852" marker-end="url(#a)"/>
  <text class="lbl" x="816" y="216" text-anchor="middle">PASS</text>
  <path class="deny" d="M690 168V102" marker-end="url(#x)"/>
  <text class="no" x="702" y="140" text-anchor="start">no verdict</text>
  <path class="f" d="M690 280V314" marker-end="url(#a)"/>
  <text class="lbl" x="702" y="304" text-anchor="start">CHANGES_REQUESTED</text>
  <path class="f" d="M600 376H144V262" marker-end="url(#a)"/>
  <text class="lbl" x="370" y="368" text-anchor="middle">yes, with findings</text>
  <path class="deny" d="M780 376H852" marker-end="url(#x)"/>
  <text class="lbl" x="816" y="368" text-anchor="middle">no</text>
  <rect class="key" x="24" y="452" width="28" height="16" rx="4"/>
  <text class="lbl" x="62" y="465" text-anchor="start">the subject of the ADR</text>
  <rect class="bad" x="260" y="452" width="28" height="16" rx="4"/>
  <text class="lbl" x="298" y="465" text-anchor="start">workflow halts or stops</text>
</svg>
