  <text class="lbl" x="419" y="184">incidents</text>
  <path class="r" d="M665 144V250" marker-end="url(#m)"/>
  <text class="lbl" x="677" y="184">read-only requests</text>

  <path class="f" d="M800 282H914" marker-end="url(#a)"/>
  <text class="lbl" x="860" y="274" text-anchor="middle">records</text>
  <path class="r" d="M800 366H914" marker-end="url(#m)"/>
  <text class="lbl" x="860" y="358" text-anchor="middle">parked</text>

  <path class="f" d="M217 400V506" marker-end="url(#a)"/>
  <text class="lbl" x="229" y="440">launches with a lease</text>
  <path class="f" d="M535 400V506" marker-end="url(#a)"/>
  <text class="lbl" x="547" y="440">launches</text>
  <path class="f" d="M775 400V506" marker-end="url(#a)"/>
  <text class="lbl" x="787" y="440">launches</text>

  <path class="f" d="M149 570V678" marker-end="url(#a)"/>
