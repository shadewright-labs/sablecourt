<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1112" role="img" aria-labelledby="t d" data-diagram="components" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="t">Sablecourt system context</title>
  <desc id="d">Three callers reach the sablecourtd control plane: sablectl and the web UI submit, steer and approve; Shadewright sends incidents and verifications with a scoped token; Nightloom sends read-only requests with an observer token. The control plane, the Model Gate, the MCP Gate and the Approval Queue all run inside the sablecourtd process. The control plane records to the store, which holds the audit chain, and a dashed box lists the parts parked by ADR-0011: Citadel mode, the Kubernetes runtime, PostgreSQL, A2A and the GitHub webhook. The control plane launches three kinds of workload, each with a task lease: a Docker workload, a host coding run (unsupported for 0.1.0, moving into harness containers in issue 181) and a harness container for one council turn. The Docker workload calls the Model Gate for inference and the MCP Gate for tools. The host coding run calls the MCP Gate. The harness container reaches the MCP Gate through its proxy and reaches only its provider hosts for login and inference, outside the Model Gate. The Model Gate forwards to the model providers with the provider key. The MCP Gate sends actions that policy marks approve to the Approval Queue, which waits for a person, and opens pull requests on the Git host.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2dd4bf"/></marker>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#8a8594"/></marker>
    <marker id="x" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#f87171"/></marker>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2dd4bf" stop-opacity=".22"/><stop offset="1" stop-color="#2dd4bf" stop-opacity=".06"/></linearGradient>
