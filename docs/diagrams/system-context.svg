  <text class="s" x="936" y="297">SQLite with the audit chain</text>
  <rect class="plan" x="920" y="330" width="316" height="72" rx="10"/>
  <text class="h" x="936" y="356">Parked by ADR-0011</text>
  <text class="s" x="936" y="377">Citadel, Kubernetes, PostgreSQL,</text>
  <text class="s" x="936" y="394">A2A, GitHub webhook</text>

  <rect class="lane" x="24" y="452" width="1232" height="144" rx="14"/>
  <text class="lanet" x="44" y="482">WORKLOADS</text>
  <rect class="box" x="44" y="506" width="346" height="64" rx="10"/>
  <text class="h" x="60" y="532">Docker workload</text>
  <text class="s" x="60" y="553">long-lived agent or controller</text>
  <rect class="box" x="430" y="506" width="210" height="64" rx="10"/>
  <text class="h" x="446" y="532">Host coding run</text>
  <text class="s" x="446" y="553">Seatbelt, unsupported</text>
  <rect class="box" x="670" y="506" width="210" height="64" rx="10"/>
  <text class="h" x="686" y="532">Harness container</text>
  <text class="s" x="686" y="553">council turn, internal net</text>

  <rect class="lane" x="24" y="624" width="1232" height="246" rx="14"/>
  <text class="lanet" x="44" y="654">GATES</text>
  <rect class="box" x="44" y="678" width="210" height="64" rx="10"/>
  <text class="h" x="60" y="704">Model Gate</text>
  <text class="s" x="60" y="725">lease, grant, budget</text>
  <rect class="box" x="302" y="678" width="404" height="64" rx="10"/>
  <text class="h" x="318" y="704">MCP Gate</text>
  <text class="s" x="318" y="725">tools and typed actions, policy decides</text>
  <rect class="wait" x="302" y="782" width="210" height="64" rx="10"/>
  <text class="h" x="318" y="808">Approval Queue</text>
  <text class="s" x="318" y="829">pins the digest, asks you</text>

  <rect class="lane" x="24" y="898" width="1232" height="144" rx="14"/>
  <text class="lanet" x="44" y="928">OUTSIDE</text>
  <rect class="ext" x="44" y="952" width="210" height="64" rx="10"/>
  <text class="h" x="60" y="978">Model providers</text>
  <text class="s" x="60" y="999">API endpoints</text>
  <rect class="ext" x="540" y="952" width="210" height="64" rx="10"/>
  <text class="h" x="556" y="978">Git host</text>
  <text class="s" x="556" y="999">pull requests</text>
  <rect class="ext" x="790" y="952" width="210" height="64" rx="10"/>
  <text class="h" x="806" y="978">Provider hosts</text>
  <text class="s" x="806" y="999">login and inference only</text>

