  <rect class="box" x="44" y="80" width="210" height="64" rx="10"/>
  <text class="h" x="60" y="106">sablectl and web UI</text>
  <text class="s" x="60" y="127">operator token or session</text>
  <rect class="ext" x="302" y="80" width="210" height="64" rx="10"/>
