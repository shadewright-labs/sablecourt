<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 384" role="img" aria-labelledby="t d" data-diagram="flow" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="t">Reconciler pass</title>
  <desc id="d">One pass of the reconciler. It recovers tasks with no live handle, then observes each working or input-required task. If the runtime is running, a heartbeat is recorded and leases are renewed. If it exited, the task is finished with artifacts, a terminal state and revoked leases. If it is lost or stale, the task is failed with a reason and leases are revoked. All three paths end at launching submitted tasks, up to the limits.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2dd4bf"/></marker>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#8a8594"/></marker>
    <marker id="x" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#f87171"/></marker>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2dd4bf" stop-opacity=".22"/><stop offset="1" stop-color="#2dd4bf" stop-opacity=".06"/></linearGradient>
    <style>
      .lane{fill:#111422;stroke:#373040}
      .lanet{fill:#8a8594;font-size:13px;font-weight:600;letter-spacing:.14em}
      .box{fill:#14111c;stroke:#8a8594;stroke-width:1.2}
      .key{fill:url(#glow);stroke:#2dd4bf;stroke-width:1.6}
      .ext{fill:#14111c;stroke:#7fd6b4;stroke-width:1.2}
      .plan{fill:#14111c;stroke:#8a8594;stroke-width:1.2;stroke-dasharray:5 4}
      .wait{fill:#14111c;stroke:#f0b86a;stroke-width:1.2}
      .bad{fill:#14111c;stroke:#f87171;stroke-width:1.2}
      .frame{fill:none;stroke:#bbb4c5;stroke-dasharray:5 5;stroke-width:1.2}
      .h{fill:#efe9dc;font-size:15px;font-weight:650}
      .s{fill:#bbb4c5;font-size:12.5px}
      .cap{fill:#8a8594;font-size:12.5px}
      .pn{fill:#8a8594;font-size:12px;font-weight:600;letter-spacing:.06em}
      .n{fill:#2dd4bf;font-size:12px;font-weight:700;letter-spacing:.08em}
      .idt{fill:#bbb4c5;font-size:12px;font-weight:600;letter-spacing:.06em}
      .lbl{fill:#bbb4c5;font-size:12px}
      .no{fill:#f87171;font-size:13px;font-weight:600}
      .f{stroke:#2dd4bf;stroke-width:1.8;fill:none}
      .r{stroke:#8a8594;stroke-width:1.4;fill:none;stroke-dasharray:4 4}
      .deny{stroke:#f87171;stroke-width:1.4;fill:none;stroke-dasharray:4 4}
      .life{stroke:#373040;stroke-width:1.2;fill:none;stroke-dasharray:4 4}
    </style>
  </defs>
  <rect width="1120" height="384" rx="18" fill="#08060e"/>
  <rect class="box" x="24" y="160" width="168" height="64" rx="10"/>
  <text class="h" x="40" y="186">Recover</text>
  <text class="s" x="40" y="207">reattach or fail</text>
  <rect class="box" x="240" y="160" width="168" height="64" rx="10"/>
  <text class="h" x="256" y="186">Observe tasks</text>
  <text class="s" x="256" y="207">adapter reports state</text>
  <polygon class="box" points="460,192 540,140 620,192 540,244"/>
  <text class="s" x="540" y="197" text-anchor="middle">Runtime state?</text>
  <rect class="box" x="676" y="160" width="168" height="64" rx="10"/>
  <text class="h" x="692" y="186">Heartbeat</text>
  <text class="s" x="692" y="207">renew leases</text>
  <rect class="key" x="900" y="160" width="180" height="64" rx="12"/>
  <text class="h" x="916" y="186">Launch</text>
  <text class="s" x="916" y="207">submitted tasks</text>
  <rect class="bad" x="440" y="36" width="200" height="64" rx="10"/>
  <text class="no" x="456" y="62">Fail the task</text>
  <text class="s" x="456" y="83">reason, leases revoked</text>
  <rect class="box" x="440" y="296" width="200" height="64" rx="10"/>
  <text class="h" x="456" y="322">Finish the task</text>
  <text class="s" x="456" y="343">artifacts, leases, stop</text>
  <path class="f" d="M192 192H234" marker-end="url(#a)"/>
  <path class="f" d="M408 192H454" marker-end="url(#a)"/>
  <path class="f" d="M620 192H670" marker-end="url(#a)"/>
  <text class="lbl" x="645" y="184" text-anchor="middle">running</text>
  <path class="f" d="M844 192H894" marker-end="url(#a)"/>
  <path class="deny" d="M540 140V106" marker-end="url(#x)"/>
  <text class="no" x="550" y="126">lost or stale</text>
  <path class="f" d="M540 244V290" marker-end="url(#a)"/>
  <text class="lbl" x="550" y="272">exited</text>
  <path class="deny" d="M640 68H990V154" marker-end="url(#x)"/>
  <path class="f" d="M640 328H990V230" marker-end="url(#a)"/>
</svg>
