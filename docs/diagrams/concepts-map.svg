<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 636" role="img" aria-labelledby="t d" data-diagram="components" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="t">Sablecourt concept map</title>
  <desc id="d">YAML manifests of six kinds (Workload, Policy, Budget, Workflow, Schedule and Conclave) are loaded and validated by the sablecourtd control plane. Operators reach the control plane from sablectl and the web UI with an operator token or session cookie. Inside the sablecourtd process sit both the control plane (reconciler, scheduler and Conclave broker) and the gates (Model Gate, MCP Gate and Approval Queue). Both the control plane and the gates record state and audit rows to the Store, which holds the SHA-256 audit chain in SQLite WAL (with PostgreSQL parked). The control plane mints a short-lived task lease and launches workloads through the runtimes (harness containers for coding runs and council turns, Docker workload and deterministic controller), and workloads call the gates with that lease.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2dd4bf"/></marker>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#8a8594"/></marker>
    <marker id="x" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#f87171"/></marker>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2dd4bf" stop-opacity=".22"/><stop offset="1" stop-color="#2dd4bf" stop-opacity=".06"/></linearGradient>
    <style>
      .lane{fill:#111422;stroke:#373040}
      .lanet{fill:#8a8594;font-size:13px;font-weight:600;letter-spacing:.14em}
      .box{fill:#14111c;stroke:#8a8594;stroke-width:1.2}
      .key{fill:url(#glow);stroke:#2dd4bf;stroke-width:1.6}
      .ext{fill:#14111c;stroke:#7fd6b4;stroke-width:1.2}
      .plan{fill:#14111c;stroke:#8a8594;stroke-width:1.2;stroke-dasharray:5 4}
      .wait{fill:#14111c;stroke:#f0b86a;stroke-width:1.2}
      .bad{fill:#14111c;stroke:#f87171;stroke-width:1.2}
      .frame{fill:none;stroke:#bbb4c5;stroke-dasharray:5 5;stroke-width:1.2}
      .h{fill:#efe9dc;font-size:15px;font-weight:650}
      .s{fill:#bbb4c5;font-size:12.5px}
      .cap{fill:#8a8594;font-size:12.5px}
      .pn{fill:#8a8594;font-size:12px;font-weight:600;letter-spacing:.06em}
      .n{fill:#2dd4bf;font-size:12px;font-weight:700;letter-spacing:.08em}
      .idt{fill:#bbb4c5;font-size:12px;font-weight:600;letter-spacing:.06em}
      .lbl{fill:#bbb4c5;font-size:12px}
      .no{fill:#f87171;font-size:13px;font-weight:600}
      .f{stroke:#2dd4bf;stroke-width:1.8;fill:none}
      .r{stroke:#8a8594;stroke-width:1.4;fill:none;stroke-dasharray:4 4}
      .deny{stroke:#f87171;stroke-width:1.4;fill:none;stroke-dasharray:4 4}
      .life{stroke:#373040;stroke-width:1.2;fill:none;stroke-dasharray:4 4}
    </style>
  </defs>
  <rect width="1280" height="636" rx="18" fill="#08060e"/>

  <rect class="lane" x="24" y="24" width="572" height="144" rx="14"/>
  <text class="lanet" x="44" y="52">INPUTS</text>
  <rect class="box" x="44" y="68" width="244" height="80" rx="10"/>
  <text class="h" x="60" y="94">Manifests</text>
  <text class="s" x="60" y="114">Workload, Policy, Budget,</text>
  <text class="s" x="60" y="132">Workflow, Schedule, Conclave</text>
  <rect class="box" x="336" y="68" width="240" height="80" rx="10"/>
  <text class="h" x="352" y="94">sablectl and web UI</text>
  <text class="s" x="352" y="114">operator token or session</text>
  <text class="s" x="352" y="132">submit, steer, approve</text>

  <rect class="lane" x="644" y="24" width="612" height="144" rx="14"/>
  <text class="lanet" x="664" y="52">STORE</text>
  <rect class="box" x="664" y="68" width="284" height="80" rx="10"/>
  <text class="h" x="680" y="94">Store</text>
  <text class="s" x="680" y="114">SQLite WAL (PostgreSQL parked)</text>
  <text class="s" x="680" y="132">tasks, leases, budgets, memory</text>
  <rect class="box" x="1020" y="68" width="216" height="80" rx="10"/>
  <text class="h" x="1036" y="94">Audit chain</text>
  <text class="s" x="1036" y="114">SHA-256 hash chain</text>
  <text class="s" x="1036" y="132">audit_log rows</text>

  <rect class="lane" x="24" y="236" width="1232" height="156" rx="14"/>
  <text class="lanet" x="44" y="264">SABLECOURTD</text>
  <rect class="key" x="44" y="284" width="716" height="88" rx="12"/>
  <text class="h" x="60" y="312">sablecourtd control plane</text>
  <text class="s" x="60" y="334">reconciler, scheduler, Conclave broker</text>
  <text class="s" x="60" y="352">mints a short-lived task lease per run</text>
  <rect class="box" x="824" y="284" width="412" height="88" rx="10"/>
  <text class="h" x="840" y="312">Gates</text>
  <text class="s" x="840" y="334">Model Gate, MCP Gate, Approval Queue</text>
  <text class="s" x="840" y="352">policy, budget and human confirmation</text>

  <rect class="lane" x="24" y="460" width="1232" height="152" rx="14"/>
  <text class="lanet" x="44" y="488">WORKLOADS</text>
  <rect class="box" x="336" y="508" width="680" height="84" rx="10"/>
  <text class="h" x="352" y="536">Runtimes</text>
  <text class="s" x="352" y="558">harness container (coding, council), Docker workload, deterministic controller</text>
  <text class="s" x="352" y="576">harness container uses its own subscription login</text>

  <path class="f" d="M220 148V282" marker-end="url(#a)"/>
  <text class="lbl" x="232" y="206">loaded and validated</text>
  <path class="f" d="M456 148V282" marker-end="url(#a)"/>
  <text class="lbl" x="468" y="206">operator credential</text>
  <path class="f" d="M712 284V150" marker-end="url(#a)"/>
  <text class="lbl" x="724" y="206">records</text>
  <path class="f" d="M886 284V150" marker-end="url(#a)"/>
  <text class="lbl" x="898" y="206">records</text>
  <path class="f" d="M948 108H1018" marker-end="url(#a)"/>
  <text class="lbl" x="984" y="100" text-anchor="middle">holds</text>

  <path class="f" d="M548 372V506" marker-end="url(#a)"/>
  <text class="lbl" x="560" y="430">launches with lease</text>
  <path class="f" d="M920 508V374" marker-end="url(#a)"/>
  <text class="lbl" x="932" y="430">calls with lease</text>
</svg>
