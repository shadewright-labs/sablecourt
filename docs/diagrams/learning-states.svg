<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 340" role="img" aria-labelledby="t d" data-diagram="states" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="t">Learning record states</title>
  <desc id="d">A learning record starts proposed after a propose step. Accept with evidence moves proposed to accepted and starts a 90-day clock. Confirm with a supporting outcome keeps it accepted and restarts the clock. A contradiction or the end of 90 days moves accepted back to proposed. Retire moves proposed or accepted to retired, and accepting a replacement retires its predecessor. Retired is terminal. The store enforces all of this, but no route, page or command calls it yet, so every transition is planned. Only the import migration creates proposed records today.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2dd4bf"/></marker>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#8a8594"/></marker>
    <marker id="x" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#f87171"/></marker>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2dd4bf" stop-opacity=".22"/><stop offset="1" stop-color="#2dd4bf" stop-opacity=".06"/></linearGradient>
    <style>
      .lane{fill:#111422;stroke:#373040}
      .lanet{fill:#8a8594;font-size:13px;font-weight:600;letter-spacing:.14em}
      .box{fill:#14111c;stroke:#8a8594;stroke-width:1.2}
      .key{fill:url(#glow);stroke:#2dd4bf;stroke-width:1.6}
      .ext{fill:#14111c;stroke:#7fd6b4;stroke-width:1.2}
      .plan{fill:#14111c;stroke:#8a8594;stroke-width:1.2;stroke-dasharray:5 4}
      .wait{fill:#14111c;stroke:#f0b86a;stroke-width:1.2}
      .bad{fill:#14111c;stroke:#f87171;stroke-width:1.2}
      .frame{fill:none;stroke:#bbb4c5;stroke-dasharray:5 5;stroke-width:1.2}
      .h{fill:#efe9dc;font-size:15px;font-weight:650}
      .s{fill:#bbb4c5;font-size:12.5px}
      .cap{fill:#8a8594;font-size:12.5px}
      .pn{fill:#8a8594;font-size:12px;font-weight:600;letter-spacing:.06em}
      .n{fill:#2dd4bf;font-size:12px;font-weight:700;letter-spacing:.08em}
      .idt{fill:#bbb4c5;font-size:12px;font-weight:600;letter-spacing:.06em}
      .lbl{fill:#bbb4c5;font-size:12px}
      .no{fill:#f87171;font-size:13px;font-weight:600}
      .f{stroke:#2dd4bf;stroke-width:1.8;fill:none}
      .r{stroke:#8a8594;stroke-width:1.4;fill:none;stroke-dasharray:4 4}
      .deny{stroke:#f87171;stroke-width:1.4;fill:none;stroke-dasharray:4 4}
      .life{stroke:#373040;stroke-width:1.2;fill:none;stroke-dasharray:4 4}
    </style>
  </defs>
  <rect width="1120" height="340" rx="18" fill="#08060e"/>
  <circle cx="160" cy="52" r="5" fill="#8a8594"/>
  <path class="r" d="M160 57V94" marker-end="url(#m)"/>
  <text class="lbl" x="172" y="82">propose</text>

  <rect class="box" x="60" y="100" width="200" height="64" rx="10"/>
  <text class="h" x="76" y="126">proposed</text>
  <text class="s" x="76" y="147">not used for advice</text>
  <rect class="key" x="460" y="100" width="200" height="64" rx="12"/>
  <text class="h" x="476" y="126">accepted</text>
  <text class="s" x="476" y="147">90-day clock running</text>
  <rect class="box" x="460" y="240" width="200" height="64" rx="10"/>
  <text class="h" x="476" y="266">retired</text>
  <text class="s" x="476" y="287">terminal</text>

  <path class="r" d="M260 122H454" marker-end="url(#m)"/>
  <text class="lbl" x="357" y="114" text-anchor="middle">accept with evidence</text>
  <path class="r" d="M454 150H266" marker-end="url(#m)"/>
  <text class="lbl" x="357" y="170" text-anchor="middle">contradiction or 90 days</text>
  <path class="r" d="M540 100C520 52 600 52 580 100" marker-end="url(#m)"/>
  <text class="lbl" x="560" y="44" text-anchor="middle">confirm with supporting outcome</text>
  <path class="r" d="M560 164V234" marker-end="url(#m)"/>
  <text class="lbl" x="572" y="204">retire, or replaced</text>
  <path class="r" d="M160 164V272H454" marker-end="url(#m)"/>
  <text class="lbl" x="300" y="264" text-anchor="middle">retire</text>

  <text class="cap" x="720" y="116">The store enforces every transition.</text>
  <text class="cap" x="720" y="136">No route, page or command calls them</text>
  <text class="cap" x="720" y="156">yet, so every line is dashed (planned).</text>
</svg>
