<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 640" role="img" aria-labelledby="t d" data-diagram="sequence" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="t">Approval exchange</title>
  <desc id="d">Sequence of an approval among a workload, the MCP Gate, the Approval Queue and a person. The workload calls an action. The gate asks the queue for an approval with the payload digest pinned and answers the workload 202 with an approval id. The person approves with the digest, the queue shows a native dialog, and the person clicks Approve. The workload repeats the call with the approval id. The gate spends the approval once, only if it is approved and matches the same task, capability and payload digest and has not expired, checking expiry at that moment, and then returns the action result. The approval is bound to the digest of the exact value, so a changed payload needs a new approval.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2dd4bf"/></marker>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#8a8594"/></marker>
    <marker id="x" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#f87171"/></marker>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2dd4bf" stop-opacity=".22"/><stop offset="1" stop-color="#2dd4bf" stop-opacity=".06"/></linearGradient>
    <style>
      .lane{fill:#111422;stroke:#373040}
      .lanet{fill:#8a8594;font-size:13px;font-weight:600;letter-spacing:.14em}
      .box{fill:#14111c;stroke:#8a8594;stroke-width:1.2}
      .key{fill:url(#glow);stroke:#2dd4bf;stroke-width:1.6}
      .ext{fill:#14111c;stroke:#7fd6b4;stroke-width:1.2}
      .plan{fill:#14111c;stroke:#8a8594;stroke-width:1.2;stroke-dasharray:5 4}
      .wait{fill:#14111c;stroke:#f0b86a;stroke-width:1.2}
      .bad{fill:#14111c;stroke:#f87171;stroke-width:1.2}
      .frame{fill:none;stroke:#bbb4c5;stroke-dasharray:5 5;stroke-width:1.2}
      .h{fill:#efe9dc;font-size:15px;font-weight:650}
      .s{fill:#bbb4c5;font-size:12.5px}
      .cap{fill:#8a8594;font-size:12.5px}
      .pn{fill:#8a8594;font-size:12px;font-weight:600;letter-spacing:.06em}
      .n{fill:#2dd4bf;font-size:12px;font-weight:700;letter-spacing:.08em}
      .idt{fill:#bbb4c5;font-size:12px;font-weight:600;letter-spacing:.06em}
      .lbl{fill:#bbb4c5;font-size:12px}
      .no{fill:#f87171;font-size:13px;font-weight:600}
      .f{stroke:#2dd4bf;stroke-width:1.8;fill:none}
      .r{stroke:#8a8594;stroke-width:1.4;fill:none;stroke-dasharray:4 4}
      .deny{stroke:#f87171;stroke-width:1.4;fill:none;stroke-dasharray:4 4}
      .life{stroke:#373040;stroke-width:1.2;fill:none;stroke-dasharray:4 4}
    </style>
  </defs>
  <rect width="1120" height="640" rx="18" fill="#08060e"/>
  <rect class="box" x="60" y="24" width="180" height="56" rx="10"/>
  <text class="h" x="150" y="58" text-anchor="middle">Workload</text>
  <rect class="box" x="320" y="24" width="180" height="56" rx="10"/>
  <text class="h" x="410" y="58" text-anchor="middle">MCP Gate</text>
  <rect class="key" x="580" y="24" width="180" height="56" rx="12"/>
  <text class="h" x="670" y="58" text-anchor="middle">Approval Queue</text>
  <rect class="box" x="840" y="24" width="180" height="56" rx="10"/>
  <text class="h" x="930" y="58" text-anchor="middle">Person</text>
  <path class="life" d="M150 80V612"/>
  <path class="life" d="M410 80V612"/>
  <path class="life" d="M670 80V612"/>
  <path class="life" d="M930 80V612"/>
  <path class="f" d="M150 132H404" marker-end="url(#a)"/>
  <text class="lbl" x="277" y="124" text-anchor="middle">action call</text>
  <path class="f" d="M410 192H664" marker-end="url(#a)"/>
  <text class="lbl" x="537" y="184" text-anchor="middle">request, digest pinned</text>
  <path class="r" d="M404 252H156" marker-end="url(#m)"/>
  <text class="lbl" x="280" y="244" text-anchor="middle">202, approval id</text>
  <path class="f" d="M924 312H676" marker-end="url(#a)"/>
  <text class="lbl" x="800" y="304" text-anchor="middle">approve with digest</text>
  <path class="f" d="M676 372H924" marker-end="url(#a)"/>
  <text class="lbl" x="800" y="364" text-anchor="middle">native dialog</text>
  <path class="r" d="M924 432H676" marker-end="url(#m)"/>
  <text class="lbl" x="800" y="424" text-anchor="middle">clicks Approve</text>
  <path class="f" d="M156 492H404" marker-end="url(#a)"/>
  <text class="lbl" x="280" y="484" text-anchor="middle">repeat with approval id</text>
  <rect class="box" x="270" y="508" width="280" height="52" rx="8"/>
  <text class="s" x="410" y="529" text-anchor="middle">spend once: same task, capability</text>
  <text class="s" x="410" y="547" text-anchor="middle">and digest, expiry checked now</text>
  <path class="r" d="M404 592H156" marker-end="url(#m)"/>
  <text class="lbl" x="280" y="584" text-anchor="middle">action result</text>
</svg>
