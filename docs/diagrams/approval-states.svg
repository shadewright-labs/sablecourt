<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 328" role="img" aria-labelledby="t d" data-diagram="states" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="t">Approval states</title>
  <desc id="d">States of an approval. A start dot leads to Pending, created when policy returns approve. Pending moves to Approved when a person confirms in the native dialog and the proof is stored, to Denied when the operator denies it (declining the dialog leaves it pending), and to Expired when the approve call or the reconciler finds it past the 15-minute deadline. Approved moves to Consumed when a repeated call matches the task, capability and payload digest before the expiry; Consumed is terminal, so the approval is used once. A note says a refused use, a mismatch or a use after the expiry, changes nothing.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2dd4bf"/></marker>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#8a8594"/></marker>
    <marker id="x" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#f87171"/></marker>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2dd4bf" stop-opacity=".22"/><stop offset="1" stop-color="#2dd4bf" stop-opacity=".06"/></linearGradient>
    <style>
      .lane{fill:#111422;stroke:#373040}
      .lanet{fill:#8a8594;font-size:13px;font-weight:600;letter-spacing:.14em}
      .box{fill:#14111c;stroke:#8a8594;stroke-width:1.2}
      .key{fill:url(#glow);stroke:#2dd4bf;stroke-width:1.6}
      .ext{fill:#14111c;stroke:#7fd6b4;stroke-width:1.2}
      .plan{fill:#14111c;stroke:#8a8594;stroke-width:1.2;stroke-dasharray:5 4}
      .wait{fill:#14111c;stroke:#f0b86a;stroke-width:1.2}
      .bad{fill:#14111c;stroke:#f87171;stroke-width:1.2}
      .frame{fill:none;stroke:#bbb4c5;stroke-dasharray:5 5;stroke-width:1.2}
      .h{fill:#efe9dc;font-size:15px;font-weight:650}
      .s{fill:#bbb4c5;font-size:12.5px}
      .cap{fill:#8a8594;font-size:12.5px}
      .pn{fill:#8a8594;font-size:12px;font-weight:600;letter-spacing:.06em}
      .n{fill:#2dd4bf;font-size:12px;font-weight:700;letter-spacing:.08em}
      .idt{fill:#bbb4c5;font-size:12px;font-weight:600;letter-spacing:.06em}
      .lbl{fill:#bbb4c5;font-size:12px}
      .no{fill:#f87171;font-size:13px;font-weight:600}
      .f{stroke:#2dd4bf;stroke-width:1.8;fill:none}
      .r{stroke:#8a8594;stroke-width:1.4;fill:none;stroke-dasharray:4 4}
      .deny{stroke:#f87171;stroke-width:1.4;fill:none;stroke-dasharray:4 4}
      .life{stroke:#373040;stroke-width:1.2;fill:none;stroke-dasharray:4 4}
    </style>
  </defs>
  <rect width="1120" height="328" rx="18" fill="#08060e"/>
  <circle cx="140" cy="48" r="5" fill="#2dd4bf"/>
  <path class="f" d="M140 53V94" marker-end="url(#a)"/>
  <rect class="wait" x="40" y="100" width="270" height="64" rx="10"/>
  <text class="h" x="56" y="126">Pending</text>
  <text class="s" x="56" y="147">policy returned approve</text>
  <rect class="key" x="480" y="100" width="210" height="64" rx="12"/>
  <text class="h" x="496" y="126">Approved</text>
  <text class="s" x="496" y="147">proof stored</text>
  <rect class="bad" x="40" y="240" width="200" height="64" rx="10"/>
  <text class="no" x="56" y="266">Denied</text>
  <text class="s" x="56" y="287">terminal</text>
  <rect class="bad" x="280" y="240" width="200" height="64" rx="10"/>
  <text class="no" x="296" y="266">Expired</text>
  <text class="s" x="296" y="287">terminal</text>
  <path class="f" d="M310 132H474" marker-end="url(#a)"/>
  <text class="lbl" x="392" y="124" text-anchor="middle">dialog confirms</text>
  <path class="deny" d="M120 164V234" marker-end="url(#x)"/>
  <text class="no" x="130" y="205">operator denies</text>
  <path class="deny" d="M295 164V234" marker-end="url(#x)"/>
  <text class="no" x="305" y="205">15 minutes pass</text>
  <rect class="box" x="860" y="100" width="220" height="64" rx="10"/>
  <text class="h" x="876" y="126">Consumed</text>
  <text class="s" x="876" y="147">used once, terminal</text>
  <path class="f" d="M690 132H854" marker-end="url(#a)"/>
  <text class="lbl" x="772" y="124" text-anchor="middle">repeat call matches</text>
  <text class="lbl" x="772" y="152" text-anchor="middle">before the expiry</text>
  <text class="cap" x="496" y="190">a refused use (a mismatch, or</text>
  <text class="cap" x="496" y="208">after the expiry) changes nothing</text>
</svg>
