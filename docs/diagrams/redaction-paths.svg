<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 648" role="img" aria-labelledby="t d" data-diagram="components" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="t">Where redaction applies</title>
  <desc id="d">Two zones. In the first, text Sablecourt writes, which is coding output, council diffs, Conclave posts and context packets, is filtered by the pattern redactor, which is best effort and knows only some secret shapes, and the redacted text goes to the store, the UI and peer prompts. A dashed planned box, exact match of secrets the daemon holds, adds to the redactor and is not built yet. In the second zone, the two model-provider paths, no redaction applies. The built-in agent (the sablecourt-agent container) sends its task history and context packet as requests to the Model Gate, which forwards the same bytes to the model providers outside Sablecourt. A harness container, which can read any file in its checkout, sends requests to the council proxy, which copies a TLS tunnel it cannot read to the listed provider hosts on port 443, outside Sablecourt. A legend marks the subject, outside systems and planned.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2dd4bf"/></marker>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#8a8594"/></marker>
    <marker id="x" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#f87171"/></marker>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2dd4bf" stop-opacity=".22"/><stop offset="1" stop-color="#2dd4bf" stop-opacity=".06"/></linearGradient>
    <style>
      .lane{fill:#111422;stroke:#373040}
      .lanet{fill:#8a8594;font-size:13px;font-weight:600;letter-spacing:.14em}
      .box{fill:#14111c;stroke:#8a8594;stroke-width:1.2}
      .key{fill:url(#glow);stroke:#2dd4bf;stroke-width:1.6}
      .ext{fill:#14111c;stroke:#7fd6b4;stroke-width:1.2}
      .plan{fill:#14111c;stroke:#8a8594;stroke-width:1.2;stroke-dasharray:5 4}
      .wait{fill:#14111c;stroke:#f0b86a;stroke-width:1.2}
      .bad{fill:#14111c;stroke:#f87171;stroke-width:1.2}
      .frame{fill:none;stroke:#bbb4c5;stroke-dasharray:5 5;stroke-width:1.2}
      .h{fill:#efe9dc;font-size:15px;font-weight:650}
      .s{fill:#bbb4c5;font-size:12.5px}
      .cap{fill:#8a8594;font-size:12.5px}
      .pn{fill:#8a8594;font-size:12px;font-weight:600;letter-spacing:.06em}
      .n{fill:#2dd4bf;font-size:12px;font-weight:700;letter-spacing:.08em}
      .idt{fill:#bbb4c5;font-size:12px;font-weight:600;letter-spacing:.06em}
      .lbl{fill:#bbb4c5;font-size:12px}
      .no{fill:#f87171;font-size:13px;font-weight:600}
      .f{stroke:#2dd4bf;stroke-width:1.8;fill:none}
      .r{stroke:#8a8594;stroke-width:1.4;fill:none;stroke-dasharray:4 4}
      .deny{stroke:#f87171;stroke-width:1.4;fill:none;stroke-dasharray:4 4}
      .life{stroke:#373040;stroke-width:1.2;fill:none;stroke-dasharray:4 4}
    </style>
  </defs>
  <rect width="1120" height="648" rx="18" fill="#08060e"/>
  <rect class="lane" x="24" y="24" width="1072" height="276" rx="14"/>
  <text class="lanet" x="44" y="54">WHERE SABLECOURT WRITES TEXT</text>
  <rect class="lane" x="24" y="324" width="1072" height="260" rx="14"/>
  <text class="lanet" x="44" y="354">WHERE CONTENT REACHES PROVIDERS, NO REDACTION</text>
  <rect class="box" x="44" y="88" width="250" height="72" rx="10"/>
  <text class="h" x="60" y="114">Text Sablecourt writes</text>
  <text class="s" x="60" y="135">coding output, council diffs,</text>
  <text class="s" x="60" y="152">Conclave posts, context packets</text>
  <rect class="key" x="366" y="88" width="250" height="72" rx="12"/>
  <text class="h" x="382" y="114">Pattern redactor</text>
  <text class="s" x="382" y="135">best effort,</text>
  <text class="s" x="382" y="152">known secret shapes only</text>
  <rect class="box" x="688" y="88" width="250" height="72" rx="10"/>
  <text class="h" x="704" y="114">Store, UI, peer prompts</text>
  <text class="s" x="704" y="135">where readers and peers see it</text>
  <rect class="plan" x="366" y="208" width="250" height="72" rx="10"/>
  <text class="h" x="382" y="234">Exact match</text>
  <text class="s" x="382" y="255">secrets the daemon holds,</text>
  <text class="s" x="382" y="272">planned</text>
  <path class="f" d="M294 124H360" marker-end="url(#a)"/>
  <text class="lbl" x="327" y="116" text-anchor="middle">filtered</text>
  <path class="f" d="M616 124H682" marker-end="url(#a)"/>
  <text class="lbl" x="649" y="116" text-anchor="middle">redacted</text>
  <path class="r" d="M491 208V166" marker-end="url(#m)"/>
  <text class="lbl" x="503" y="192" text-anchor="start">adds</text>
  <rect class="box" x="44" y="388" width="210" height="64" rx="10"/>
  <text class="h" x="60" y="414">Built-in agent</text>
  <text class="s" x="60" y="435">sablecourt-agent container</text>
  <rect class="box" x="400" y="388" width="210" height="64" rx="10"/>
  <text class="h" x="416" y="414">Model Gate</text>
  <text class="s" x="416" y="435">forwards bytes as sent</text>
  <rect class="ext" x="756" y="388" width="210" height="64" rx="10"/>
  <text class="h" x="772" y="414">Model providers</text>
  <text class="s" x="772" y="435">API endpoints</text>
  <path class="f" d="M254 420H394" marker-end="url(#a)"/>
  <text class="lbl" x="324" y="412" text-anchor="middle">request</text>
  <path class="f" d="M610 420H750" marker-end="url(#a)"/>
  <text class="lbl" x="680" y="412" text-anchor="middle">same bytes</text>
  <rect class="box" x="44" y="492" width="210" height="72" rx="10"/>
  <text class="h" x="60" y="518">Harness container</text>
  <text class="s" x="60" y="539">any file in its checkout</text>
  <rect class="box" x="400" y="492" width="210" height="72" rx="10"/>
  <text class="h" x="416" y="518">Council proxy</text>
  <text class="s" x="416" y="539">copies a TLS tunnel,</text>
  <text class="s" x="416" y="556">cannot read it</text>
  <rect class="ext" x="756" y="492" width="210" height="72" rx="10"/>
  <text class="h" x="772" y="518">Provider hosts</text>
  <text class="s" x="772" y="539">listed hosts, port 443</text>
  <path class="f" d="M254 528H394" marker-end="url(#a)"/>
  <text class="lbl" x="324" y="520" text-anchor="middle">requests</text>
  <path class="f" d="M610 528H750" marker-end="url(#a)"/>
  <text class="lbl" x="680" y="520" text-anchor="middle">TLS tunnel</text>
  <rect class="key" x="24" y="608" width="28" height="16" rx="4"/>
  <text class="lbl" x="62" y="621" text-anchor="start">the subject of the ADR</text>
  <rect class="ext" x="300" y="608" width="28" height="16" rx="4"/>
  <text class="lbl" x="338" y="621" text-anchor="start">outside Sablecourt</text>
  <rect class="plan" x="560" y="608" width="28" height="16" rx="4"/>
  <text class="lbl" x="598" y="621" text-anchor="start">planned</text>
</svg>
