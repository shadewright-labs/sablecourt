<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 392" role="img" aria-labelledby="t d" data-diagram="states" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="t">Conclave states</title>
  <desc id="d">A Conclave opens Active. Active moves to Completed on close, and to Input-required when a Ward trips. A Decree moves Input-required back to Active. Input-required moves to Cancelled on a stop, and close and stop end either open state. For a plain room a close request can also move Cancelled to Completed and back; a council's end state is locked. A Ward trip on maxMessages, maxPingPong or the budget revokes the gate leases of running turns. A room paused on maxMessages, or a plain room that reaches its wall time, stays Input-required and a Decree cannot resume it.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2dd4bf"/></marker>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#8a8594"/></marker>
    <marker id="x" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#f87171"/></marker>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2dd4bf" stop-opacity=".22"/><stop offset="1" stop-color="#2dd4bf" stop-opacity=".06"/></linearGradient>
    <style>
      .lane{fill:#111422;stroke:#373040}
      .lanet{fill:#8a8594;font-size:13px;font-weight:600;letter-spacing:.14em}
      .box{fill:#14111c;stroke:#8a8594;stroke-width:1.2}
      .key{fill:url(#glow);stroke:#2dd4bf;stroke-width:1.6}
      .ext{fill:#14111c;stroke:#7fd6b4;stroke-width:1.2}
      .plan{fill:#14111c;stroke:#8a8594;stroke-width:1.2;stroke-dasharray:5 4}
      .wait{fill:#14111c;stroke:#f0b86a;stroke-width:1.2}
      .bad{fill:#14111c;stroke:#f87171;stroke-width:1.2}
      .frame{fill:none;stroke:#bbb4c5;stroke-dasharray:5 5;stroke-width:1.2}
      .h{fill:#efe9dc;font-size:15px;font-weight:650}
      .s{fill:#bbb4c5;font-size:12.5px}
      .cap{fill:#8a8594;font-size:12.5px}
      .pn{fill:#8a8594;font-size:12px;font-weight:600;letter-spacing:.06em}
      .n{fill:#2dd4bf;font-size:12px;font-weight:700;letter-spacing:.08em}
      .idt{fill:#bbb4c5;font-size:12px;font-weight:600;letter-spacing:.06em}
      .lbl{fill:#bbb4c5;font-size:12px}
      .no{fill:#f87171;font-size:13px;font-weight:600}
      .f{stroke:#2dd4bf;stroke-width:1.8;fill:none}
      .r{stroke:#8a8594;stroke-width:1.4;fill:none;stroke-dasharray:4 4}
      .deny{stroke:#f87171;stroke-width:1.4;fill:none;stroke-dasharray:4 4}
      .life{stroke:#373040;stroke-width:1.2;fill:none;stroke-dasharray:4 4}
    </style>
  </defs>
  
  <rect width="1120" height="392" rx="18" fill="#08060e"/>
  <circle cx="140" cy="48" r="5" fill="#2dd4bf"/>
  <path class="f" d="M140 53V94" marker-end="url(#a)"/>
  <rect class="key" x="40" y="100" width="200" height="64" rx="12"/>
  <text class="h" x="56" y="126">Active</text>
  <text class="s" x="56" y="147">Vassals take turns</text>
  <rect class="box" x="400" y="100" width="200" height="64" rx="10"/>
  <text class="h" x="416" y="126">Completed</text>
  <text class="s" x="416" y="147">closed</text>
  <rect class="wait" x="40" y="240" width="200" height="64" rx="10"/>
  <text class="h" x="56" y="266">Input-required</text>
  <text class="s" x="56" y="287">paused by a Ward</text>
  <rect class="box" x="400" y="240" width="200" height="64" rx="10"/>
  <text class="h" x="416" y="266">Cancelled</text>
  <text class="s" x="416" y="287">stopped</text>
  <path class="f" d="M240 132H394" marker-end="url(#a)"/>
  <text class="lbl" x="317" y="124" text-anchor="middle">close</text>
  <path class="f" d="M100 164V234" marker-end="url(#a)"/>
  <text class="lbl" x="110" y="206" text-anchor="start">Ward trips</text>
  <path class="f" d="M180 234V170" marker-end="url(#a)"/>
  <text class="lbl" x="190" y="190" text-anchor="start">Decree</text>
  <path class="r" d="M500 170V234" marker-start="url(#m)" marker-end="url(#m)"/>
  <text class="lbl" x="510" y="206" text-anchor="start">close request (plain room)</text>
  <path class="f" d="M240 272H394" marker-end="url(#a)"/>
  <text class="lbl" x="317" y="264" text-anchor="middle">stop</text>
  <text class="cap" x="416" y="330" text-anchor="start">close and stop end either open state</text>
  <text class="cap" x="40" y="352" text-anchor="start">a room paused on maxMessages, or a plain room at its wall time, stays Input-required and a Decree cannot resume it</text>
  <text class="cap" x="40" y="376" text-anchor="start">a council's Completed and Cancelled are locked; a plain room can switch between them on a close request</text>
</svg>
