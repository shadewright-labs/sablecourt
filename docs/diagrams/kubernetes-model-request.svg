<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 736" role="img" aria-labelledby="t d" data-diagram="sequence" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="t">Planned model request path</title>
  <desc id="d">Planned path of one model request in the cluster. 1: the harness pod sends the request to the Model Gate in sablecourtd with its lease as the API key; network policy lets the pod reach only the daemon. 2: the Model Gate checks the lease, the model grant and reserves budget in PostgreSQL, which returns a reservation or a refusal. If any check fails, the Model Gate refuses with 403. 3: the Model Gate forwards the request with task labels over mutual TLS to agentgateway in the gateway namespace. 4: agentgateway checks its route allowlist and rate limit, adds the provider key and calls the provider. The provider streams the answer with usage; agentgateway records the token metric and streams the response back to the Model Gate. 5: the Model Gate settles the reservation and writes the audit record, then streams the response to the pod.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2dd4bf"/></marker>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#8a8594"/></marker>
    <marker id="x" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#f87171"/></marker>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2dd4bf" stop-opacity=".22"/><stop offset="1" stop-color="#2dd4bf" stop-opacity=".06"/></linearGradient>
    <style>
      .lane{fill:#111422;stroke:#373040}
      .lanet{fill:#8a8594;font-size:13px;font-weight:600;letter-spacing:.14em}
      .box{fill:#14111c;stroke:#8a8594;stroke-width:1.2}
      .key{fill:url(#glow);stroke:#2dd4bf;stroke-width:1.6}
      .ext{fill:#14111c;stroke:#7fd6b4;stroke-width:1.2}
      .plan{fill:#14111c;stroke:#8a8594;stroke-width:1.2;stroke-dasharray:5 4}
      .wait{fill:#14111c;stroke:#f0b86a;stroke-width:1.2}
      .bad{fill:#14111c;stroke:#f87171;stroke-width:1.2}
      .frame{fill:none;stroke:#bbb4c5;stroke-dasharray:5 5;stroke-width:1.2}
      .h{fill:#efe9dc;font-size:15px;font-weight:650}
      .s{fill:#bbb4c5;font-size:12.5px}
      .cap{fill:#8a8594;font-size:12.5px}
      .pn{fill:#8a8594;font-size:12px;font-weight:600;letter-spacing:.06em}
      .n{fill:#2dd4bf;font-size:12px;font-weight:700;letter-spacing:.08em}
      .idt{fill:#bbb4c5;font-size:12px;font-weight:600;letter-spacing:.06em}
      .lbl{fill:#bbb4c5;font-size:12px}
      .no{fill:#f87171;font-size:13px;font-weight:600}
      .f{stroke:#2dd4bf;stroke-width:1.8;fill:none}
      .r{stroke:#8a8594;stroke-width:1.4;fill:none;stroke-dasharray:4 4}
      .deny{stroke:#f87171;stroke-width:1.4;fill:none;stroke-dasharray:4 4}
      .life{stroke:#373040;stroke-width:1.2;fill:none;stroke-dasharray:4 4}
    </style>
  </defs>
  <rect width="1120" height="736" rx="18" fill="#08060e"/>
  <rect class="box" x="40" y="24" width="176" height="56" rx="10"/>
  <text class="h" x="128" y="57" text-anchor="middle">Harness pod</text>
  <rect class="key" x="256" y="24" width="176" height="56" rx="12"/>
  <text class="h" x="344" y="57" text-anchor="middle">Model Gate</text>
  <rect class="box" x="472" y="24" width="176" height="56" rx="10"/>
  <text class="h" x="560" y="57" text-anchor="middle">PostgreSQL</text>
  <rect class="plan" x="688" y="24" width="176" height="56" rx="10"/>
  <text class="h" x="776" y="57" text-anchor="middle">agentgateway</text>
  <rect class="ext" x="904" y="24" width="176" height="56" rx="10"/>
  <text class="h" x="992" y="57" text-anchor="middle">Provider</text>
  <path class="life" d="M128 80V676"/>
  <path class="life" d="M344 80V676"/>
  <path class="life" d="M560 80V676"/>
  <path class="life" d="M776 80V676"/>
  <path class="life" d="M992 80V676"/>
  <text class="pn" x="344" y="100" text-anchor="middle">in sablecourtd</text>
  <text class="pn" x="776" y="100" text-anchor="middle">gateway namespace</text>
  <path class="f" d="M128 140H338" marker-end="url(#a)"/>
  <text class="lbl" x="236" y="132" text-anchor="middle">1 lease as API key</text>
  <text class="cap" x="136" y="160">policy: pod to daemon only</text>
  <path class="f" d="M344 200H554" marker-end="url(#a)"/>
  <text class="lbl" x="452" y="192" text-anchor="middle">2 lease, grant, reserve</text>
  <path class="r" d="M560 252H350" marker-end="url(#m)"/>
  <text class="lbl" x="452" y="244" text-anchor="middle">reservation or refusal</text>
  <path class="deny" d="M344 312H134" marker-end="url(#x)"/>
  <text class="no" x="236" y="304" text-anchor="middle">403 when any check fails</text>
  <path class="f" d="M344 372H770" marker-end="url(#a)"/>
  <text class="lbl" x="620" y="364" text-anchor="middle">3 forward, task labels, mTLS</text>
  <path class="f" d="M776 432H986" marker-end="url(#a)"/>
  <text class="lbl" x="884" y="424" text-anchor="middle">4 adds provider key</text>
  <text class="cap" x="784" y="452">route allowlist, rate limit</text>
  <path class="r" d="M992 492H782" marker-end="url(#m)"/>
  <text class="lbl" x="884" y="484" text-anchor="middle">stream with usage</text>
  <text class="cap" x="768" y="512" text-anchor="end">records token metric</text>
  <path class="r" d="M776 552H350" marker-end="url(#m)"/>
  <text class="lbl" x="620" y="544" text-anchor="middle">response stream</text>
  <path class="f" d="M344 612H554" marker-end="url(#a)"/>
  <text class="lbl" x="452" y="604" text-anchor="middle">5 settle, audit</text>
  <path class="r" d="M344 660H134" marker-end="url(#m)"/>
  <text class="lbl" x="236" y="652" text-anchor="middle">response</text>
  <rect class="key" x="48" y="696" width="28" height="16" rx="4"/>
  <text class="cap" x="84" y="708">Model Gate, built</text>
  <rect class="plan" x="238" y="696" width="28" height="16" rx="4"/>
  <text class="cap" x="274" y="708">planned</text>
  <rect class="ext" x="356" y="696" width="28" height="16" rx="4"/>
  <text class="cap" x="392" y="708">outside Sablecourt</text>
  <path class="deny" d="M553 704H581"/>
  <text class="cap" x="589" y="708">refused</text>
</svg>
