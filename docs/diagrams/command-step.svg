<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 456" role="img" aria-labelledby="t d" data-diagram="flow" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="t">Command step</title>
  <desc id="d">When an author step completes, the control plane submits the command step with the author's commit. Launch checks resolve the command from the manifest through the step registration and need the run's recorded author base. A second check is that a harness container can be built and started. If either fails, the step is refused before the command runs, never on the host, and the run is halted when the task is a registered command step. Otherwise the command runs inside the harness container on a read-only checkout of the author's commit, with no task lease and a proxy with no provider host. When it exits, its result is recorded, capped and redacted. A passed result moves the run to the next step, which follows the author's task. Any other outcome halts the run with the reason recorded on it, in one transaction with its event and audit row.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2dd4bf"/></marker>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#8a8594"/></marker>
    <marker id="x" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#f87171"/></marker>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2dd4bf" stop-opacity=".22"/><stop offset="1" stop-color="#2dd4bf" stop-opacity=".06"/></linearGradient>
    <style>
      .box{fill:#14111c;stroke:#8a8594;stroke-width:1.2}
      .key{fill:url(#glow);stroke:#2dd4bf;stroke-width:1.6}
      .bad{fill:#14111c;stroke:#f87171;stroke-width:1.2}
      .frame{fill:none;stroke:#bbb4c5;stroke-dasharray:5 5;stroke-width:1.2}
      .h{fill:#efe9dc;font-size:15px;font-weight:650}
      .s{fill:#bbb4c5;font-size:12.5px}
      .idt{fill:#bbb4c5;font-size:12px;font-weight:600;letter-spacing:.06em}
      .lbl{fill:#bbb4c5;font-size:12px}
      .no{fill:#f87171;font-size:13px;font-weight:600}
      .f{stroke:#2dd4bf;stroke-width:1.8;fill:none}
      .deny{stroke:#f87171;stroke-width:1.4;fill:none;stroke-dasharray:4 4}
    </style>
  </defs>
  <rect width="1120" height="456" rx="18" fill="#08060e"/>

  <rect class="box" x="44" y="100" width="176" height="64" rx="10"/>
  <text class="h" x="60" y="126">Author step</text>
  <text class="s" x="60" y="147">completes, commits</text>

  <polygon class="box" points="268,132 344,88 420,132 344,176"/>
  <text class="s" x="344" y="137" text-anchor="middle">Checks pass?</text>

  <polygon class="box" points="492,132 568,88 644,132 568,176"/>
  <text class="s" x="568" y="137" text-anchor="middle">Container built?</text>

  <rect class="frame" x="700" y="48" width="276" height="140" rx="12"/>
  <text class="idt" x="716" y="72">HARNESS CONTAINER</text>
  <rect class="key" x="716" y="92" width="244" height="80" rx="12"/>
  <text class="h" x="732" y="118">Command runs</text>
  <text class="s" x="732" y="139">read-only author commit</text>
  <text class="s" x="732" y="156">no lease, no provider host</text>

  <rect class="bad" x="268" y="232" width="376" height="64" rx="10"/>
  <text class="h" x="284" y="258">Refused before it runs</text>
  <text class="no" x="284" y="279">never on the host</text>

  <rect class="box" x="716" y="232" width="244" height="64" rx="10"/>
  <text class="h" x="732" y="258">Result recorded</text>
  <text class="s" x="732" y="279">capped, redacted, stored</text>

  <rect class="bad" x="416" y="368" width="228" height="64" rx="10"/>
  <text class="h" x="432" y="394">Run halted</text>
  <text class="s" x="432" y="415">one transaction</text>

  <rect class="box" x="852" y="368" width="228" height="64" rx="10"/>
  <text class="h" x="868" y="394">Next step</text>
  <text class="s" x="868" y="415">follows the author's task</text>

  <path class="f" d="M220 132H262" marker-end="url(#a)"/>
  <path class="f" d="M420 132H486" marker-end="url(#a)"/>
  <text class="lbl" x="456" y="124" text-anchor="middle">yes</text>
  <path class="f" d="M644 132H710" marker-end="url(#a)"/>
  <text class="lbl" x="672" y="124" text-anchor="middle">yes</text>

  <path class="deny" d="M344 176V226" marker-end="url(#x)"/>
  <text class="no" x="356" y="208">no</text>
  <path class="deny" d="M568 176V226" marker-end="url(#x)"/>
  <text class="no" x="580" y="208">no</text>
  <path class="deny" d="M530 296V362" marker-end="url(#x)"/>
  <text class="lbl" x="542" y="334">halts if registered</text>

  <path class="f" d="M838 172V226" marker-end="url(#a)"/>
  <text class="lbl" x="850" y="208">exits</text>
  <path class="f" d="M920 296V362" marker-end="url(#a)"/>
  <text class="lbl" x="932" y="334">passed</text>
  <path class="deny" d="M760 296V400H650" marker-end="url(#x)"/>
  <text class="lbl" x="772" y="334">not passed</text>
</svg>
