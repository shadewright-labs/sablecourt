<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 440" role="img" aria-labelledby="t d" data-diagram="components" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="t">What a council looks like</title>
  <desc id="d">What a council looks like. The operator's question and any Decrees for a seat's role or for all go into the council, a fixed panel of three seats, claude, codex and agy. Each turn of a seat is one harness container. In round 1 each seat answers alone. A barrier holds round 2 until all three round 1 answers are recorded. In round 2 each seat also reads the recorded, redacted answers of round 1. In parallel mode a seat sees only earlier rounds; with the sequential flag it also sees the seats before it in its own round. At close the daemon writes a digest from the recorded answers. Ceilings bound the council: two rounds by default, at most six starts and a wall time of 15 minutes.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2dd4bf"/></marker>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#8a8594"/></marker>
    <marker id="x" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#f87171"/></marker>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2dd4bf" stop-opacity=".22"/><stop offset="1" stop-color="#2dd4bf" stop-opacity=".06"/></linearGradient>
    <style>
      .lane{fill:#111422;stroke:#373040}
      .lanet{fill:#8a8594;font-size:13px;font-weight:600;letter-spacing:.14em}
      .box{fill:#14111c;stroke:#8a8594;stroke-width:1.2}
      .key{fill:url(#glow);stroke:#2dd4bf;stroke-width:1.6}
      .ext{fill:#14111c;stroke:#7fd6b4;stroke-width:1.2}
      .plan{fill:#14111c;stroke:#8a8594;stroke-width:1.2;stroke-dasharray:5 4}
      .wait{fill:#14111c;stroke:#f0b86a;stroke-width:1.2}
      .bad{fill:#14111c;stroke:#f87171;stroke-width:1.2}
      .frame{fill:none;stroke:#bbb4c5;stroke-dasharray:5 5;stroke-width:1.2}
      .h{fill:#efe9dc;font-size:15px;font-weight:650}
      .s{fill:#bbb4c5;font-size:12.5px}
      .cap{fill:#8a8594;font-size:12.5px}
      .pn{fill:#8a8594;font-size:12px;font-weight:600;letter-spacing:.06em}
      .n{fill:#2dd4bf;font-size:12px;font-weight:700;letter-spacing:.08em}
      .idt{fill:#bbb4c5;font-size:12px;font-weight:600;letter-spacing:.06em}
      .lbl{fill:#bbb4c5;font-size:12px}
      .no{fill:#f87171;font-size:13px;font-weight:600}
      .f{stroke:#2dd4bf;stroke-width:1.8;fill:none}
      .r{stroke:#8a8594;stroke-width:1.4;fill:none;stroke-dasharray:4 4}
      .deny{stroke:#f87171;stroke-width:1.4;fill:none;stroke-dasharray:4 4}
      .life{stroke:#373040;stroke-width:1.2;fill:none;stroke-dasharray:4 4}
    </style>
  </defs>
  <rect width="1120" height="440" rx="18" fill="#08060e"/>
  <rect class="lane" x="250" y="24" width="600" height="392" rx="14"/>
  <text class="lanet" x="270" y="54">COUNCIL: THREE SEATS, ONE HARNESS CONTAINER PER TURN</text>
  <rect class="box" x="274" y="76" width="170" height="76" rx="10"/>
  <text class="h" x="290" y="102">claude</text>
  <text class="s" x="290" y="123">round 1: answers</text>
  <text class="s" x="290" y="141">the question alone</text>
  <rect class="box" x="464" y="76" width="170" height="76" rx="10"/>
  <text class="h" x="480" y="102">codex</text>
  <text class="s" x="480" y="123">round 1: answers</text>
  <text class="s" x="480" y="141">the question alone</text>
  <rect class="box" x="654" y="76" width="170" height="76" rx="10"/>
  <text class="h" x="670" y="102">agy</text>
  <text class="s" x="670" y="123">round 1: answers</text>
  <text class="s" x="670" y="141">the question alone</text>
  <rect class="key" x="274" y="184" width="550" height="58" rx="10"/>
  <text class="h" x="290" y="210">Barrier</text>
  <text class="s" x="290" y="231">round 2 starts only when all three round 1 answers are recorded</text>
  <rect class="box" x="274" y="282" width="170" height="76" rx="10"/>
  <text class="h" x="290" y="308">claude</text>
  <text class="s" x="290" y="329">round 2: also reads</text>
  <text class="s" x="290" y="347">round 1 answers</text>
  <rect class="box" x="464" y="282" width="170" height="76" rx="10"/>
