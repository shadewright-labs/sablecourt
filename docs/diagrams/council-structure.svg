  <text class="s" x="480" y="329">round 2: also reads</text>
  <text class="s" x="480" y="347">round 1 answers</text>
  <rect class="box" x="654" y="282" width="170" height="76" rx="10"/>
  <text class="h" x="670" y="308">agy</text>
  <text class="s" x="670" y="329">round 2: also reads</text>
  <text class="s" x="670" y="347">round 1 answers</text>
  <path class="f" d="M359 152V178" marker-end="url(#a)"/>
  <path class="f" d="M359 242V276" marker-end="url(#a)"/>
  <path class="f" d="M549 152V178" marker-end="url(#a)"/>
  <path class="f" d="M549 242V276" marker-end="url(#a)"/>
  <path class="f" d="M739 152V178" marker-end="url(#a)"/>
  <path class="f" d="M739 242V276" marker-end="url(#a)"/>
  <text class="cap" x="274" y="382">Parallel: a seat sees only earlier rounds, redacted.</text>
  <text class="cap" x="274" y="400">With --sequential it also sees the seats before it.</text>
  <rect class="box" x="24" y="150" width="202" height="100" rx="10"/>
  <text class="h" x="40" y="176">Question</text>
  <text class="s" x="40" y="197">redacted, at most 30 KiB</text>
  <text class="s" x="40" y="215">Decrees for the seat's role</text>
  <text class="s" x="40" y="233">or for all</text>
  <path class="f" d="M226 200H244" marker-end="url(#a)"/>
  <rect class="box" x="886" y="150" width="210" height="100" rx="10"/>
  <text class="h" x="902" y="176">Digest</text>
  <text class="s" x="902" y="197">written at close from</text>
  <text class="s" x="902" y="215">the recorded answers,</text>
  <text class="s" x="902" y="233">no summary</text>
  <path class="f" d="M850 200H880" marker-end="url(#a)"/>
  <text class="lbl" x="868" y="190" text-anchor="middle">close</text>
  <rect class="box" x="886" y="290" width="210" height="100" rx="10"/>
  <text class="h" x="902" y="316">Ceilings</text>
  <text class="s" x="902" y="337">rounds: 2 by default</text>
  <text class="s" x="902" y="355">starts: 6 at most</text>
  <text class="s" x="902" y="373">wall time: 15 minutes</text>

</svg>
