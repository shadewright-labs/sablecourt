<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1072" role="img" aria-labelledby="t d" data-diagram="sequence" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="t">One council turn</title>
  <desc id="d">One seat of one council round on the Docker path. sablectl sends the question and operator token to the daemon. In the daemon the broker reserves the turn and its task in one transaction, and the reconciler mints the task lease, storing only its SHA-256. The daemon starts a per-launch proxy with the lease digest, then has Docker start the harness container with the lease and prompt on standard input. The harness sends gate calls to the proxy as plain HTTP with the lease in a bearer header; the proxy checks the route and the digest and forwards to the daemon. The harness opens a CONNECT tunnel through the proxy to a listed provider host on port 443; any other host or port is denied. When the harness exits, the daemon gets its standard output and exit code through Docker, and the broker records the answer only for exit code 0 with a final message. After the barrier the next round starts with peer excerpts, and at close the store writes the digest Relic. sablectl prints the answers and the digest. Replies are dashed, and the legend marks the provider outside Sablecourt and the refused connection.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2dd4bf"/></marker>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#8a8594"/></marker>
    <marker id="x" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#f87171"/></marker>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2dd4bf" stop-opacity=".22"/><stop offset="1" stop-color="#2dd4bf" stop-opacity=".06"/></linearGradient>
