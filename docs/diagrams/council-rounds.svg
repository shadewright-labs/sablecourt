  <text class="s" x="390" y="264" text-anchor="middle">lease minted, only its hash stored</text>
  <path class="f" d="M396 320H904" marker-end="url(#a)"/>
  <text class="lbl" x="650" y="312" text-anchor="middle">start, lease digest</text>
  <path class="f" d="M396 372H644" marker-end="url(#a)"/>
  <text class="lbl" x="520" y="364" text-anchor="middle">lease on stdin</text>
  <path class="f" d="M656 436H904" marker-end="url(#a)"/>
  <text class="lbl" x="780" y="428" text-anchor="middle">gate read, lease</text>
  <path class="f" d="M904 488H396" marker-end="url(#a)"/>
  <text class="lbl" x="650" y="480" text-anchor="middle">digest checked</text>
  <path class="f" d="M656 552H904" marker-end="url(#a)"/>
  <text class="lbl" x="780" y="544" text-anchor="middle">CONNECT provider</text>
  <path class="f" d="M916 604H1144" marker-end="url(#a)"/>
  <text class="lbl" x="1030" y="596" text-anchor="middle">tunnel, port 443</text>
  <path class="deny" d="M656 668H904" marker-end="url(#x)"/>
  <text class="lbl" x="780" y="660" text-anchor="middle">other host</text>
  <text class="no" x="780" y="688" text-anchor="middle">denied</text>
  <path class="r" d="M644 752H396" marker-end="url(#m)"/>
  <text class="lbl" x="520" y="744" text-anchor="middle">stdout, exit code</text>
  <rect class="box" x="260" y="776" width="260" height="52" rx="10"/>
  <text class="h" x="390" y="798" text-anchor="middle" font-size="14">Records the answer</text>
  <text class="s" x="390" y="818" text-anchor="middle">answer, vote, task events</text>
  <rect class="box" x="260" y="844" width="260" height="52" rx="10"/>
  <text class="h" x="390" y="866" text-anchor="middle" font-size="14">Barrier, then round two</text>
  <text class="s" x="390" y="886" text-anchor="middle">repeat with peer excerpts</text>
  <rect class="box" x="260" y="912" width="260" height="52" rx="10"/>
  <text class="h" x="390" y="934" text-anchor="middle" font-size="14">Closes and writes the digest</text>
  <text class="s" x="390" y="954" text-anchor="middle">digest Relic, audit rows</text>
  <path class="r" d="M384 1000H136" marker-end="url(#m)"/>
  <text class="lbl" x="260" y="992" text-anchor="middle">answers, digest</text>
  <rect class="ext" x="60" y="1068" width="28" height="16" rx="4"/>
  <text class="lbl" x="98" y="1081">outside Sablecourt</text>
  <path class="deny" d="M270 1076H310" marker-end="url(#x)"/>
  <text class="lbl" x="320" y="1081">refused</text>
  <path class="r" d="M420 1076H460" marker-end="url(#m)"/>
  <text class="lbl" x="470" y="1081">reply or output</text>
</svg>
