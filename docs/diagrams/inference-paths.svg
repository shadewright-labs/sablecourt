<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 572" role="img" aria-labelledby="t d" data-diagram="components" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="t">Two inference paths, default configuration</title>
  <desc id="d">The default configuration: a council turn in a harness container, and the built-in agent calling a cloud provider with no external model gateway. Top lane, a harness turn with its own login: the harness CLI (claude, codex or agy, with its own login volume) and the council proxy sit on the per-launch internal network. The harness talks to the proxy over plain HTTP. The proxy opens a CONNECT tunnel on port 443 to the harness's provider, which the harness's own login authenticates. The proxy forwards gate calls with the lease to the sablecourtd gate routes, which check the lease in the daemon. The daemon sees no provider traffic or token counts. Bottom lane, the built-in agent through the Model Gate: the built-in agent, which holds no provider key, sends requests with only its lease to the Model Gate inside sablecourtd. The Model Gate checks lease, grant and budget and forwards to the model provider with the provider API key the daemon holds. The Model Gate settles usage in the budget ledger and writes audit rows in the store.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2dd4bf"/></marker>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#8a8594"/></marker>
    <marker id="x" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#f87171"/></marker>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2dd4bf" stop-opacity=".22"/><stop offset="1" stop-color="#2dd4bf" stop-opacity=".06"/></linearGradient>
    <style>
      .lane{fill:#111422;stroke:#373040}
      .lanet{fill:#8a8594;font-size:13px;font-weight:600;letter-spacing:.14em}
      .box{fill:#14111c;stroke:#8a8594;stroke-width:1.2}
      .key{fill:url(#glow);stroke:#2dd4bf;stroke-width:1.6}
      .ext{fill:#14111c;stroke:#7fd6b4;stroke-width:1.2}
      .plan{fill:#14111c;stroke:#8a8594;stroke-width:1.2;stroke-dasharray:5 4}
      .wait{fill:#14111c;stroke:#f0b86a;stroke-width:1.2}
      .bad{fill:#14111c;stroke:#f87171;stroke-width:1.2}
      .frame{fill:none;stroke:#bbb4c5;stroke-dasharray:5 5;stroke-width:1.2}
      .h{fill:#efe9dc;font-size:15px;font-weight:650}
      .s{fill:#bbb4c5;font-size:12.5px}
      .cap{fill:#8a8594;font-size:12.5px}
      .pn{fill:#8a8594;font-size:12px;font-weight:600;letter-spacing:.06em}
      .n{fill:#2dd4bf;font-size:12px;font-weight:700;letter-spacing:.08em}
      .idt{fill:#bbb4c5;font-size:12px;font-weight:600;letter-spacing:.06em}
      .lbl{fill:#bbb4c5;font-size:12px}
      .no{fill:#f87171;font-size:13px;font-weight:600}
      .f{stroke:#2dd4bf;stroke-width:1.8;fill:none}
      .r{stroke:#8a8594;stroke-width:1.4;fill:none;stroke-dasharray:4 4}
      .deny{stroke:#f87171;stroke-width:1.4;fill:none;stroke-dasharray:4 4}
      .life{stroke:#373040;stroke-width:1.2;fill:none;stroke-dasharray:4 4}
    </style>
  </defs>
  <rect width="1120" height="572" rx="18" fill="#08060e"/>

  <rect class="lane" x="24" y="24" width="1072" height="236" rx="14"/>
  <text class="lanet" x="44" y="54">HARNESS TURN, OWN LOGIN</text>
  <rect class="frame" x="40" y="68" width="532" height="112" rx="12"/>
  <text class="idt" x="56" y="88">PER-LAUNCH INTERNAL NETWORK</text>

  <rect class="box" x="56" y="100" width="210" height="64" rx="10"/>
  <text class="h" x="72" y="126">Harness CLI</text>
  <text class="s" x="72" y="147">own login volume</text>

  <rect class="box" x="344" y="100" width="210" height="64" rx="10"/>
  <text class="h" x="360" y="126">Council proxy</text>
  <text class="s" x="360" y="147">tunnels to its own hosts</text>

  <rect class="ext" x="866" y="100" width="210" height="64" rx="10"/>
  <text class="h" x="882" y="126">Provider</text>
  <text class="s" x="882" y="147">harness's own login</text>

  <rect class="box" x="600" y="184" width="240" height="64" rx="10"/>
  <text class="h" x="616" y="210">sablecourtd gate routes</text>
  <text class="s" x="616" y="231">lease checked in daemon</text>

  <path class="f" d="M266 132H338" marker-end="url(#a)"/>
  <text class="lbl" x="305" y="124" text-anchor="middle">plain HTTP</text>
  <path class="f" d="M554 132H860" marker-end="url(#a)"/>
  <text class="lbl" x="710" y="124" text-anchor="middle">CONNECT 443</text>
  <path class="f" d="M449 164V216H594" marker-end="url(#a)"/>
  <text class="lbl" x="520" y="208" text-anchor="middle">gate calls</text>
  <text class="cap" x="866" y="210">no provider traffic</text>
  <text class="cap" x="866" y="227">or token counts seen</text>

  <rect class="lane" x="24" y="280" width="1072" height="268" rx="14"/>
  <text class="lanet" x="44" y="310">BUILT-IN AGENT, MODEL GATE</text>
  <rect class="frame" x="328" y="324" width="260" height="208" rx="12"/>
  <text class="idt" x="344" y="344">SABLECOURTD</text>

  <rect class="box" x="56" y="356" width="210" height="64" rx="10"/>
  <text class="h" x="72" y="382">Built-in agent</text>
  <text class="s" x="72" y="403">no provider key</text>

  <rect class="key" x="344" y="356" width="210" height="64" rx="12"/>
  <text class="h" x="360" y="382">Model Gate</text>
  <text class="s" x="360" y="403">lease, grant, budget</text>

  <rect class="box" x="344" y="456" width="210" height="64" rx="10"/>
  <text class="h" x="360" y="482">Store</text>
  <text class="s" x="360" y="503">budget ledger, audit</text>

  <rect class="ext" x="866" y="356" width="210" height="64" rx="10"/>
  <text class="h" x="882" y="382">Model provider</text>
  <text class="s" x="882" y="403">key held by daemon</text>

  <path class="f" d="M266 388H338" marker-end="url(#a)"/>
  <text class="lbl" x="296" y="380" text-anchor="middle">lease only</text>
  <path class="f" d="M554 388H860" marker-end="url(#a)"/>
  <text class="lbl" x="710" y="380" text-anchor="middle">with provider key</text>
  <path class="f" d="M449 420V450" marker-end="url(#a)"/>
  <text class="lbl" x="461" y="440">settles, audits</text>
</svg>
