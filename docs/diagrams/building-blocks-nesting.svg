  <text class="lbl" x="572" y="350">started with lease</text>

  <rect class="box" x="380" y="368" width="360" height="64" rx="10"/>
  <text class="h" x="396" y="394">Runtime adapter</text>
  <text class="s" x="396" y="415">picked by workload class</text>

  <path class="f" d="M380 400H204V474" marker-end="url(#a)"/>
  <text class="lbl" x="292" y="392" text-anchor="middle">coding-agent</text>
  <path class="f" d="M560 432V474" marker-end="url(#a)"/>
  <text class="lbl" x="572" y="458">council turn</text>
  <path class="f" d="M740 400H916V474" marker-end="url(#a)"/>
  <text class="lbl" x="828" y="392" text-anchor="middle">agent, controller</text>

  <rect class="box" x="44" y="480" width="320" height="72" rx="10"/>
  <text class="h" x="60" y="506">Host process, unsupported</text>
