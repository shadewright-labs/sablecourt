  <text class="s" x="60" y="544">harness CLI, macOS only</text>

  <rect class="box" x="400" y="480" width="320" height="72" rx="10"/>
  <text class="h" x="416" y="506">Council container</text>
  <text class="s" x="416" y="527">coding adapter through Docker</text>
  <text class="s" x="416" y="544">harness CLI, own login</text>

  <rect class="box" x="756" y="480" width="320" height="72" rx="10"/>
  <text class="h" x="772" y="506">Container</text>
  <text class="s" x="772" y="527">Docker adapter (default)</text>
  <text class="s" x="772" y="544">long-lived agent, controller</text>
</svg>
