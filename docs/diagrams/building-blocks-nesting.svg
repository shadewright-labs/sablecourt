  <text class="h" x="396" y="66">Manifests</text>
  <text class="s" x="396" y="87">Workload, Policy, Budget,</text>
  <text class="s" x="396" y="104">Workflow, Schedule, Conclave</text>

  <path class="f" d="M560 112V146" marker-end="url(#a)"/>
  <text class="lbl" x="572" y="134">declares</text>

  <rect class="box" x="380" y="152" width="360" height="64" rx="10"/>
  <text class="h" x="396" y="178">Workload</text>
  <text class="s" x="396" y="199">class, zone, runtime, grants</text>

  <path class="f" d="M560 216V250" marker-end="url(#a)"/>
  <text class="lbl" x="572" y="238">one run is</text>

  <rect class="box" x="44" y="244" width="260" height="96" rx="10"/>
