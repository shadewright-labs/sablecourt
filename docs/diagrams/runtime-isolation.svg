<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 528" role="img" aria-labelledby="t d" data-diagram="nested" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="t">Runtime isolation by class</title>
  <desc id="d">Inside the host, the daemon holds the MCP Gate, the Model Gate and the runtime adapters. A coding run executes in a harness container on a per-launch internal network with only its checkout, login volume and scratch mounted, capabilities dropped, and egress limited to its provider through a proxy; it reaches the MCP Gate with its lease via the proxy. A long-lived agent and a deterministic controller run in containers on an internal network. The agent reaches the Model Gate with its lease; the controller is refused there and never receives model access. A Kubernetes adapter is parked and drawn dashed, with a dashed line from the runtime adapters.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2dd4bf"/></marker>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#8a8594"/></marker>
    <marker id="x" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#f87171"/></marker>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2dd4bf" stop-opacity=".22"/><stop offset="1" stop-color="#2dd4bf" stop-opacity=".06"/></linearGradient>
    <style>
      .lane{fill:#111422;stroke:#373040}
      .lanet{fill:#8a8594;font-size:13px;font-weight:600;letter-spacing:.14em}
      .box{fill:#14111c;stroke:#8a8594;stroke-width:1.2}
      .key{fill:url(#glow);stroke:#2dd4bf;stroke-width:1.6}
      .ext{fill:#14111c;stroke:#7fd6b4;stroke-width:1.2}
      .plan{fill:#14111c;stroke:#8a8594;stroke-width:1.2;stroke-dasharray:5 4}
      .wait{fill:#14111c;stroke:#f0b86a;stroke-width:1.2}
      .bad{fill:#14111c;stroke:#f87171;stroke-width:1.2}
      .frame{fill:none;stroke:#bbb4c5;stroke-dasharray:5 5;stroke-width:1.2}
      .h{fill:#efe9dc;font-size:15px;font-weight:650}
      .s{fill:#bbb4c5;font-size:12.5px}
      .cap{fill:#8a8594;font-size:12.5px}
      .pn{fill:#8a8594;font-size:12px;font-weight:600;letter-spacing:.06em}
      .n{fill:#2dd4bf;font-size:12px;font-weight:700;letter-spacing:.08em}
      .idt{fill:#bbb4c5;font-size:12px;font-weight:600;letter-spacing:.06em}
      .lbl{fill:#bbb4c5;font-size:12px}
      .no{fill:#f87171;font-size:13px;font-weight:600}
      .f{stroke:#2dd4bf;stroke-width:1.8;fill:none}
      .r{stroke:#8a8594;stroke-width:1.4;fill:none;stroke-dasharray:4 4}
      .deny{stroke:#f87171;stroke-width:1.4;fill:none;stroke-dasharray:4 4}
      .life{stroke:#373040;stroke-width:1.2;fill:none;stroke-dasharray:4 4}
    </style>
  </defs>
  <rect width="1120" height="528" rx="18" fill="#08060e"/>
  <rect class="lane" x="24" y="24" width="1072" height="480" rx="14"/>
  <text class="lanet" x="44" y="54">HOST</text>
  <rect class="lane" x="48" y="72" width="1024" height="128" rx="14"/>
  <text class="lanet" x="68" y="102">SABLECOURTD</text>

  <rect class="box" x="72" y="120" width="210" height="64" rx="10"/>
  <text class="h" x="88" y="146">MCP Gate</text>
  <text class="s" x="88" y="167">tools and typed actions</text>
  <rect class="box" x="338" y="120" width="210" height="64" rx="10"/>
  <text class="h" x="354" y="146">Model Gate</text>
  <text class="s" x="354" y="167">holds provider keys</text>
  <rect class="key" x="604" y="120" width="240" height="64" rx="12"/>
  <text class="h" x="620" y="146">Runtime adapters</text>
  <text class="s" x="620" y="167">one adapter per workload class</text>

  <rect class="lane" x="48" y="232" width="250" height="232" rx="14"/>
  <text class="lanet" x="68" y="450">PER-LAUNCH NETWORK</text>
  <rect class="box" x="68" y="290" width="210" height="64" rx="10"/>
  <text class="h" x="84" y="316">Coding run</text>
  <text class="s" x="84" y="337">harness container</text>
  <text class="cap" x="68" y="380">checkout, login, scratch only</text>
  <text class="cap" x="68" y="398">egress: proxy to provider</text>
  <text class="cap" x="68" y="416">capabilities dropped</text>

  <rect class="lane" x="330" y="232" width="400" height="232" rx="14"/>
  <text class="lanet" x="350" y="450">INTERNAL NETWORK</text>
  <rect class="box" x="350" y="290" width="170" height="64" rx="10"/>
  <text class="h" x="366" y="316">Long-lived agent</text>
  <text class="s" x="366" y="337">container</text>
  <rect class="bad" x="544" y="290" width="170" height="64" rx="10"/>
  <text class="h" x="560" y="316">Controller</text>
  <text class="s" x="560" y="337">container, no model</text>
  <text class="cap" x="350" y="388">no route to the outside</text>
  <text class="cap" x="350" y="406">capabilities dropped</text>

  <rect class="frame" x="762" y="232" width="310" height="232" rx="12"/>
  <text class="idt" x="782" y="448">KUBERNETES, PARKED</text>
  <rect class="plan" x="802" y="290" width="230" height="64" rx="10"/>
  <text class="h" x="818" y="316">Kubernetes adapter</text>
  <text class="s" x="818" y="337">Jobs and Deployments</text>

  <path class="f" d="M177 290V186" marker-end="url(#a)"/>
  <text class="lbl" x="187" y="222">lease via proxy</text>
  <path class="f" d="M420 290V186" marker-end="url(#a)"/>
  <text class="lbl" x="430" y="222">lease</text>
  <path class="deny" d="M546 290V186" marker-end="url(#x)"/>
  <text class="no" x="556" y="222">never</text>
  <path class="r" d="M820 186V290" marker-end="url(#m)"/>
  <text class="lbl" x="830" y="222">parked</text>

  <rect class="plan" x="68" y="470" width="28" height="16" rx="4"/>
  <text class="lbl" x="104" y="483">parked</text>
  <path class="deny" d="M190 478H218" marker-end="url(#x)"/>
  <text class="lbl" x="228" y="483">refused</text>
</svg>
