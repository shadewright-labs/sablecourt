<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 716" role="img" aria-labelledby="t d" data-diagram="sequence" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="t">Operator sign-in and session</title>
  <desc id="d">The browser posts the operator token to sablecourtd. A wrong token is refused with 401, or 429 after too many failures. A correct token makes sablecourtd sign the expiry and host with the session key and answer 303 with a 30 minute cookie. A later request with the cookie makes sablecourtd check the signature against the session key; a write from another origin is refused with 403. Posting to logout makes sablecourtd replace the session key, which invalidates every cookie, and the cookie is cleared.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2dd4bf"/></marker>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#8a8594"/></marker>
    <marker id="x" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#f87171"/></marker>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2dd4bf" stop-opacity=".22"/><stop offset="1" stop-color="#2dd4bf" stop-opacity=".06"/></linearGradient>
    <style>
      .box{fill:#14111c;stroke:#8a8594;stroke-width:1.2}
      .key{fill:url(#glow);stroke:#2dd4bf;stroke-width:1.6}
      .bad{fill:#14111c;stroke:#f87171;stroke-width:1.2}
      .h{fill:#efe9dc;font-size:15px;font-weight:650}
      .s{fill:#bbb4c5;font-size:12.5px}
      .cap{fill:#8a8594;font-size:12.5px}
      .lbl{fill:#bbb4c5;font-size:12px}
      .no{fill:#f87171;font-size:13px;font-weight:600}
      .f{stroke:#2dd4bf;stroke-width:1.8;fill:none}
      .r{stroke:#8a8594;stroke-width:1.4;fill:none;stroke-dasharray:4 4}
      .deny{stroke:#f87171;stroke-width:1.4;fill:none;stroke-dasharray:4 4}
      .life{stroke:#373040;stroke-width:1.2;fill:none;stroke-dasharray:4 4}
    </style>
  </defs>
  <rect width="1120" height="716" rx="18" fill="#08060e"/>
  <rect class="box" x="60" y="24" width="180" height="56" rx="10"/>
  <text class="h" x="150" y="58" text-anchor="middle">Browser</text>
  <rect class="key" x="410" y="24" width="180" height="56" rx="12"/>
  <text class="h" x="500" y="58" text-anchor="middle">sablecourtd</text>
  <rect class="box" x="760" y="24" width="180" height="56" rx="10"/>
  <text class="h" x="850" y="58" text-anchor="middle">Session key</text>
  <path class="life" d="M150 80V664"/>
  <path class="life" d="M500 80V664"/>
  <path class="life" d="M850 80V664"/>

  <path class="f" d="M150 130H494" marker-end="url(#a)"/>
  <text class="lbl" x="322" y="122" text-anchor="middle">POST /login with token</text>
  <path class="deny" d="M494 186H156" marker-end="url(#x)"/>
  <text class="lbl" x="325" y="178" text-anchor="middle">wrong token refused: 401 or 429</text>
  <path class="f" d="M500 242H844" marker-end="url(#a)"/>
  <text class="lbl" x="672" y="234" text-anchor="middle">sign expiry and host</text>
  <path class="r" d="M494 298H156" marker-end="url(#m)"/>
  <text class="lbl" x="325" y="290" text-anchor="middle">303 and 30 minute cookie</text>
  <path class="f" d="M150 354H494" marker-end="url(#a)"/>
  <text class="lbl" x="322" y="346" text-anchor="middle">request with cookie</text>
  <path class="f" d="M500 410H844" marker-end="url(#a)"/>
  <text class="lbl" x="672" y="402" text-anchor="middle">check signature and expiry</text>
  <path class="deny" d="M494 466H156" marker-end="url(#x)"/>
  <text class="lbl" x="325" y="458" text-anchor="middle">write from another origin refused: 403</text>
  <path class="f" d="M150 522H494" marker-end="url(#a)"/>
  <text class="lbl" x="322" y="514" text-anchor="middle">POST /logout</text>
  <path class="f" d="M500 578H844" marker-end="url(#a)"/>
  <text class="lbl" x="672" y="570" text-anchor="middle">replace key</text>
  <path class="r" d="M494 634H156" marker-end="url(#m)"/>
  <text class="lbl" x="325" y="626" text-anchor="middle">cookie cleared, all cookies invalid</text>

  <path class="f" d="M44 692H84"/>
  <text class="lbl" x="92" y="696">call</text>
  <path class="r" d="M200 692H240"/>
  <text class="lbl" x="248" y="696">reply</text>
  <path class="deny" d="M340 692H380"/>
  <text class="lbl" x="388" y="696">refused</text>
</svg>
