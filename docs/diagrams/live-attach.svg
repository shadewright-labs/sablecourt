<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 412" role="img" aria-labelledby="t d" data-diagram="components" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="t">Scry and Takeover</title>
  <desc id="d">Live attach to a running task. The task process writes raw output to the attach hub in sablecourtd, which keeps a 64 KiB ring of redacted output. An operator opens a Scry, a read-only stream of that redacted output, and can ask for Takeover, after which the hub passes that operator stdin to the task process. The hub allows one takeover holder per task, so a second operator is refused with a red line labelled 409 while held. The hub records attach and takeover rows in the audit log. A legend marks flow and refused lines.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2dd4bf"/></marker>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#8a8594"/></marker>
    <marker id="x" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#f87171"/></marker>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2dd4bf" stop-opacity=".22"/><stop offset="1" stop-color="#2dd4bf" stop-opacity=".06"/></linearGradient>
    <style>
      .lane{fill:#111422;stroke:#373040}
      .lanet{fill:#8a8594;font-size:13px;font-weight:600;letter-spacing:.14em}
      .box{fill:#14111c;stroke:#8a8594;stroke-width:1.2}
      .key{fill:url(#glow);stroke:#2dd4bf;stroke-width:1.6}
      .ext{fill:#14111c;stroke:#7fd6b4;stroke-width:1.2}
      .plan{fill:#14111c;stroke:#8a8594;stroke-width:1.2;stroke-dasharray:5 4}
      .wait{fill:#14111c;stroke:#f0b86a;stroke-width:1.2}
      .bad{fill:#14111c;stroke:#f87171;stroke-width:1.2}
      .frame{fill:none;stroke:#bbb4c5;stroke-dasharray:5 5;stroke-width:1.2}
      .h{fill:#efe9dc;font-size:15px;font-weight:650}
      .s{fill:#bbb4c5;font-size:12.5px}
      .cap{fill:#8a8594;font-size:12.5px}
      .pn{fill:#8a8594;font-size:12px;font-weight:600;letter-spacing:.06em}
      .n{fill:#2dd4bf;font-size:12px;font-weight:700;letter-spacing:.08em}
      .idt{fill:#bbb4c5;font-size:12px;font-weight:600;letter-spacing:.06em}
      .lbl{fill:#bbb4c5;font-size:12px}
      .no{fill:#f87171;font-size:13px;font-weight:600}
      .f{stroke:#2dd4bf;stroke-width:1.8;fill:none}
      .r{stroke:#8a8594;stroke-width:1.4;fill:none;stroke-dasharray:4 4}
      .deny{stroke:#f87171;stroke-width:1.4;fill:none;stroke-dasharray:4 4}
      .life{stroke:#373040;stroke-width:1.2;fill:none;stroke-dasharray:4 4}
    </style>
  </defs>
  <rect width="1120" height="412" rx="18" fill="#08060e"/>
  <rect class="lane" x="24" y="24" width="250" height="330" rx="14"/>
  <text class="lanet" x="44" y="54">OPERATORS</text>
  <rect class="box" x="44" y="96" width="210" height="64" rx="10"/>
  <text class="h" x="60" y="122">Operator</text>
  <text class="s" x="60" y="143">scry and takeover</text>
  <rect class="box" x="44" y="196" width="210" height="64" rx="10"/>
  <text class="h" x="60" y="222">Second operator</text>
  <text class="s" x="60" y="243">while takeover is held</text>
  <rect class="lane" x="330" y="24" width="480" height="330" rx="14"/>
  <text class="lanet" x="350" y="54">SABLECOURTD</text>
  <rect class="key" x="450" y="96" width="240" height="130" rx="12"/>
  <text class="h" x="466" y="122">Attach hub</text>
  <text class="s" x="466" y="143">64 KiB ring of redacted output</text>
  <text class="s" x="466" y="160">one takeover holder per task</text>
  <rect class="box" x="450" y="270" width="240" height="64" rx="10"/>
  <text class="h" x="466" y="296">Audit log</text>
  <text class="s" x="466" y="317">attach and takeover rows</text>
  <rect class="lane" x="866" y="24" width="230" height="330" rx="14"/>
  <text class="lanet" x="886" y="54">RUNNING TASK</text>
  <rect class="box" x="886" y="96" width="190" height="72" rx="10"/>
  <text class="h" x="902" y="122">Task process</text>
  <text class="s" x="902" y="143">writes output</text>
  <text class="s" x="902" y="160">reads stdin</text>
  <path class="f" d="M450 116H260" marker-end="url(#a)"/>
  <text class="lbl" x="355" y="108" text-anchor="middle">scry: read-only stream</text>
  <path class="f" d="M260 144H450" marker-end="url(#a)"/>
  <text class="lbl" x="355" y="136" text-anchor="middle">takeover request</text>
  <path class="deny" d="M260 224H450" marker-end="url(#x)"/>
  <text class="no" x="355" y="216" text-anchor="middle">409 while held</text>
  <path class="f" d="M886 116H696" marker-end="url(#a)"/>
  <text class="lbl" x="791" y="108" text-anchor="middle">raw output</text>
  <path class="f" d="M696 144H886" marker-end="url(#a)"/>
  <text class="lbl" x="791" y="136" text-anchor="middle">stdin, holder only</text>
  <path class="f" d="M570 226V270" marker-end="url(#a)"/>
  <text class="lbl" x="582" y="252" text-anchor="start">records</text>
  <path class="f" d="M24 384H64" marker-end="url(#a)"/>
  <text class="lbl" x="74" y="388" text-anchor="start">flow</text>
  <path class="deny" d="M200 384H240" marker-end="url(#x)"/>
  <text class="lbl" x="250" y="388" text-anchor="start">refused</text>
</svg>
