<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 360" role="img" aria-labelledby="t d" data-diagram="states" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="t">Council turn states</title>
  <desc id="d">A council turn is Reserved when its task and attempt are stored. It becomes Running when the harness starts and Recorded on exit code 0 with a final message. A Running turn that errors, times out, is cancelled, exits cleanly without a final message or is lost on restart is Failed, and a Failed turn returns to Reserved as the next attempt while starts remain.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2dd4bf"/></marker>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#8a8594"/></marker>
    <marker id="x" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#f87171"/></marker>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2dd4bf" stop-opacity=".22"/><stop offset="1" stop-color="#2dd4bf" stop-opacity=".06"/></linearGradient>
    <style>
      .lane{fill:#111422;stroke:#373040}
      .lanet{fill:#8a8594;font-size:13px;font-weight:600;letter-spacing:.14em}
      .box{fill:#14111c;stroke:#8a8594;stroke-width:1.2}
      .key{fill:url(#glow);stroke:#2dd4bf;stroke-width:1.6}
      .ext{fill:#14111c;stroke:#7fd6b4;stroke-width:1.2}
      .plan{fill:#14111c;stroke:#8a8594;stroke-width:1.2;stroke-dasharray:5 4}
      .wait{fill:#14111c;stroke:#f0b86a;stroke-width:1.2}
      .bad{fill:#14111c;stroke:#f87171;stroke-width:1.2}
      .frame{fill:none;stroke:#bbb4c5;stroke-dasharray:5 5;stroke-width:1.2}
      .h{fill:#efe9dc;font-size:15px;font-weight:650}
      .s{fill:#bbb4c5;font-size:12.5px}
      .cap{fill:#8a8594;font-size:12.5px}
      .pn{fill:#8a8594;font-size:12px;font-weight:600;letter-spacing:.06em}
      .n{fill:#2dd4bf;font-size:12px;font-weight:700;letter-spacing:.08em}
      .idt{fill:#bbb4c5;font-size:12px;font-weight:600;letter-spacing:.06em}
      .lbl{fill:#bbb4c5;font-size:12px}
      .no{fill:#f87171;font-size:13px;font-weight:600}
      .f{stroke:#2dd4bf;stroke-width:1.8;fill:none}
      .r{stroke:#8a8594;stroke-width:1.4;fill:none;stroke-dasharray:4 4}
      .deny{stroke:#f87171;stroke-width:1.4;fill:none;stroke-dasharray:4 4}
      .life{stroke:#373040;stroke-width:1.2;fill:none;stroke-dasharray:4 4}
    </style>
  </defs>
  
  <rect width="1120" height="360" rx="18" fill="#08060e"/>
  <circle cx="140" cy="48" r="5" fill="#2dd4bf"/>
  <path class="f" d="M140 53V94" marker-end="url(#a)"/>
  <rect class="box" x="40" y="100" width="200" height="64" rx="10"/>
  <text class="h" x="56" y="126">Reserved</text>
  <text class="s" x="56" y="147">task and attempt stored</text>
  <rect class="key" x="320" y="100" width="200" height="64" rx="12"/>
  <text class="h" x="336" y="126">Running</text>
  <text class="s" x="336" y="147">harness started</text>
  <rect class="box" x="600" y="100" width="200" height="64" rx="10"/>
  <text class="h" x="616" y="126">Recorded</text>
  <text class="s" x="616" y="147">answer and vote saved</text>
  <rect class="bad" x="320" y="240" width="200" height="64" rx="10"/>
  <text class="no" x="336" y="266">Failed</text>
  <text class="s" x="336" y="287">no answer recorded</text>
  <path class="f" d="M240 132H314" marker-end="url(#a)"/>
  <text class="lbl" x="277" y="124" text-anchor="middle">start</text>
  <path class="f" d="M520 132H594" marker-end="url(#a)"/>
  <text class="lbl" x="557" y="124" text-anchor="middle">clean exit</text>
  <path class="deny" d="M420 164V234" marker-end="url(#x)"/>
  <text class="no" x="432" y="204" text-anchor="start">error, timeout or cancel</text>
  <path class="f" d="M320 272H140V170" marker-end="url(#a)"/>
  <text class="lbl" x="150" y="262" text-anchor="start">retry</text>
  <text class="cap" x="40" y="340" text-anchor="start">retries stop when no start is left; a clean exit with no final message, or a turn lost on restart, also counts as failed</text>
</svg>
