apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: workloads-gate-only-egress
  namespace: sablecourt
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/managed-by: sablecourt
  policyTypes:
    - Ingress
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: sablecourtd
      ports:
        - protocol: TCP
          port: 7432
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
