apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sablecourt-state
  namespace: sablecourt
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sablecourtd
  namespace: sablecourt
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: sablecourtd
  template:
    metadata:
      labels:
        app: sablecourtd
    spec:
      serviceAccountName: sablecourtd
      securityContext:
        runAsNonRoot: true
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sablecourtd
          image: ghcr.io/shadewright-labs/sablecourt:0.1.0 # x-release-please-version
          args:
            - --listen=0.0.0.0:7432
            - --gate-host=sablecourtd.sablecourt.svc:7432
            - --runtime=k8s
            - --k8s-namespace=sablecourt
            - --db=/var/lib/sablecourt/sablecourt.db
            - --manifests=/etc/sablecourt/manifests
            - --secret-file=/run/secrets/sablecourt/secrets.json
          env:
            - name: SABLECOURT_POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: sablecourt-postgres
                  key: dsn
                  optional: true
          ports:
            - containerPort: 7432
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          volumeMounts:
            - name: state
              mountPath: /var/lib/sablecourt
            - name: manifests
              mountPath: /etc/sablecourt/manifests
              readOnly: true
            - name: gate-secrets
              mountPath: /run/secrets/sablecourt
              readOnly: true
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: sablecourt-state
        - name: manifests
          configMap:
            name: sablecourt-manifests
        - name: gate-secrets
          secret:
            secretName: sablecourt-secrets
            defaultMode: 0400
---
apiVersion: v1
kind: Service
metadata:
  name: sablecourtd
  namespace: sablecourt
spec:
  selector:
    app: sablecourtd
  ports:
    - name: http
      port: 7432
      targetPort: http
