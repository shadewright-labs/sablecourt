apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sablecourtd-public
  namespace: sablecourt
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts:
        - court.example.com
      secretName: sablecourtd-tls
  rules:
    - host: court.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sablecourtd
                port:
                  number: 7432
