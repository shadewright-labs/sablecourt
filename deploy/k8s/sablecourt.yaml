apiVersion: v1
kind: Namespace
metadata:
  name: sablecourt
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sablecourtd
  namespace: sablecourt
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sablecourtd-jobs
  namespace: sablecourt
rules:
  # Least privilege: manage batch/v1 Jobs only. Zero Secrets RBAC.
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sablecourtd-jobs
  namespace: sablecourt
subjects:
  - kind: ServiceAccount
    name: sablecourtd
    namespace: sablecourt
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sablecourtd-jobs
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: workloads-gate-only-egress
  namespace: sablecourt
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/managed-by: sablecourt
  policyTypes:
    - Ingress
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: sablecourtd
      ports:
        - protocol: TCP
          port: 7432
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sablecourtd
  namespace: sablecourt
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sablecourtd
  template:
    metadata:
      labels:
        app: sablecourtd
    spec:
      serviceAccountName: sablecourtd
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sablecourtd
          image: ghcr.io/shadewright-labs/sablecourtd:0.1.0
          args:
            - --listen=0.0.0.0:7432
            - --gate-host=sablecourtd.sablecourt.svc:7432
            - --runtime=k8s
            - --k8s-namespace=sablecourt
            - --db=/var/lib/sablecourt/sablecourt.db
            - --manifests=/etc/sablecourt/manifests
          ports:
            - containerPort: 7432
              name: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          volumeMounts:
            - name: state
              mountPath: /var/lib/sablecourt
            - name: manifests
              mountPath: /etc/sablecourt/manifests
              readOnly: true
      volumes:
        - name: state
          emptyDir: {}
        - name: manifests
          configMap:
            name: sablecourt-manifests
---
apiVersion: v1
kind: Service
metadata:
  name: sablecourtd
  namespace: sablecourt
spec:
  selector:
    app: sablecourtd
  ports:
    - name: http
      port: 7432
      targetPort: http
